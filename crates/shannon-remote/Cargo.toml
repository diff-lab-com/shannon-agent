[package]
name = "shannon-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Remote execution worlds (SSH hosts, Docker containers) for Shannon tools"

[dependencies]
bytes = "1"
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
shannon-tool-interface = { path = "../shannon-tool-interface" }
shannon-core = { path = "../shannon-core" }
shannon-tools = { path = "../shannon-tools" }
# B2: shared browser foundation (detect + providers). No chromiumoxide —
# the session stays behind shannon-browser's local-browser feature.
shannon-browser = { path = "../shannon-browser" }

[dev-dependencies]
tempfile = "3"

# The openssh stack self-identifies as unix-only ("This crate can only be
# used on unix") — the Windows check compiles this crate against the ssh
# stubs in `ssh/mod.rs` instead.
[target.'cfg(unix)'.dependencies]
openssh = "0.11"
openssh-sftp-client = "0.15"
