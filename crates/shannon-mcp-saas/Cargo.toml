[package]
name = "shannon-mcp-saas"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "SaaS MCP servers (GitHub first, then Slack/Jira/Notion/Linear) — P1-3"

[features]
default = ["slack", "jira", "notion", "linear"]
slack = []
jira = []
notion = []
linear = []

[dependencies]
shannon-mcp = { path = "../shannon-mcp" }
shannon-types = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "process", "time", "sync", "net"] }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
url = "2"
# Keyring — same major (3.x) as desktop crate. default-features = false pulls
# in only the native backends (Apple Keychain / Windows Credential Manager /
# Secret Service) without the `linux-native` async-persistent variant, which
# matches the desktop's selection and keeps the dependency footprint small.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
mockito = "1.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
tempfile = "3"
