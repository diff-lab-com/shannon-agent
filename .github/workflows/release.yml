# Single release orchestrator for the shannon-agent monorepo.
#
# Produces EXACTLY ONE GitHub Release per `v*` tag containing all three
# products:
#   - shannon (Rust CLI)         — built with plain `cargo build` per target,
#                                  archived + sha256'd, uploaded via
#                                  `gh release upload --clobber`
#   - shannon-desktop (Tauri)    — built by tauri-action (releaseDraft:true;
#                                  reuses the pre-created draft, no create)
#   - shannon-gateway (Bun)      — built by `bun build --compile`, uploaded
#                                  via softprops into the same draft
#
# Why no cargo-dist `host`/`announce`: its release-ownership model wants to
# CREATE+PUBLISH the GitHub release itself, which fights our "one draft,
# collect every asset, then flip to published" model. With `release = false`
# configured, `dist host --steps=upload` actually skipped the GitHub upload
# entirely (it printed only the "may not exist yet" NOTE and uploaded nothing
# — that's why rc2's releases had zero CLI binaries). cargo-dist has been
# fully unused for the release path ever since (its config file was deleted
# 2026-08-19; the homebrew installer it declared never produced a formula).
# Building with `cargo build -p shannon-cli` directly is fully under our
# control and the shannon-cli closure contains no desktop/tauri/gtk deps, so
# the CLI job needs no system GUI libraries.
#
# Release-ordering contract:
#   - `create-release` is the ONLY job that creates the release. It runs
#     right after `prep` and idempotently guarantees EXACTLY ONE draft for
#     the tag (collapsing any duplicate releases left by a prior failed run).
#     This serializes creation and removes the concurrent create race that
#     produced rc2's two releases.
#   - `desktop`, `cli`, and `gateway` all `needs: [create-release]`, so the
#     draft exists before any of them append assets. They are upload-only.
#   - `publish` is the ONLY job that flips draft -> published; it
#     `needs: [cli, desktop, gateway]` with `if: success()`.
#
# Asset naming MUST match scripts/install.sh|install.ps1:
#   - CLI:   shannon-<target>.tar.gz  (.zip on Windows)  +  <archive>.sha256
#            each containing a binary named `shannon` / `shannon.exe`.
#   - Desktop: produced by tauri-action (shannon-desktop_<ver>_<arch>.{deb,dmg,exe} ...).
#   - Gateway: shannon-gateway-<os>-<arch> (see gateway matrix `artifact`).
#
# Triggered on `v*` tags + manual dispatch.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Never cancel a release run mid-flight (a cancelled tag build would leave
# the draft half-populated); the group only serializes duplicate triggers
# for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────── Version guard ─────────────────────────────
  # Fail early if the workspace Cargo version doesn't match the pushed tag.
  prep:
    name: version guard
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Verify version matches tag
        id: guard
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # rc/beta tags (v0.11.0-rc1) validate the upcoming core version —
          # the four sources carry 0.11.0, the tag appends a pre-release
          # suffix. Compare against the core; a truly drifted tag
          # (v0.11.1-rc1 vs 0.11.0 sources) still fails.
          VERSION="${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag:      $TAG"
          echo "Expected: $VERSION"
          # Guard ALL FOUR version sources against tag drift (v0.7.0-rc1
          # root cause: only the root Cargo.toml was checked, so the desktop
          # and gateway manifests drifted silently).
          fail() { echo "::error::$1 ($2) does not match tag ($VERSION)"; exit 1; }
          v_cargo() { grep -m1 '^version' "$1" | sed -E 's/.*"([^"]+)".*/\1/'; }
          v_json()  { grep -m1 '"version"' "$1" | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/'; }
          V="$(v_cargo Cargo.toml)";             echo "workspace Cargo.toml:  $V"; [ "$V" = "$VERSION" ] || fail workspace.package.version "$V"
          V="$(v_cargo desktop/Cargo.toml)";     echo "desktop/Cargo.toml:    $V"; [ "$V" = "$VERSION" ] || fail "desktop package version" "$V"
          V="$(v_json desktop/tauri.conf.json)"; echo "tauri.conf.json:       $V"; [ "$V" = "$VERSION" ] || fail "tauri.conf.json version" "$V"
          V="$(v_json gateway/package.json)";    echo "gateway/package.json:  $V"; [ "$V" = "$VERSION" ] || fail "gateway package.json version" "$V"
          echo "Version guard passed: $VERSION (4/4 sources)"

  # ──────────────────────────── Create draft release ───────────────────────
  # The SINGLE owner of the release. Idempotently guarantees exactly one
  # draft for the tag: if duplicate releases exist (leftover from a failed
  # prior run / a create race), keep the one with the most assets and delete
  # the rest, then create the draft if it doesn't exist yet. Every downstream
  # job depends on this so creation is fully serialized — no concurrent
  # getOrCreateRelease races.
  create-release:
    name: create draft release
    needs: [prep]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Ensure exactly one draft release for ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          # (asset_count release_id) for every release on this tag.
          mapfile -t ENTRIES < <(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | \"\(.assets|length) \(.id)\"")
          if [ "${#ENTRIES[@]}" -gt 1 ]; then
            echo "found ${#ENTRIES[@]} releases for $TAG — collapsing to one (keep most assets)"
            printf '%s\n' "${ENTRIES[@]}" | sort -rn > /tmp/rels
            keep="$(awk 'NR==1{print $2}' /tmp/rels)"
            while read -r n id; do
              [ "$id" = "$keep" ] && continue
              echo "  deleting duplicate release $id ($n assets)"
              gh api -X DELETE "repos/$REPO/releases/$id"
            done < /tmp/rels
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing"
          else
            if [[ "$TAG" == *-* ]]; then PRE="--prerelease"; else PRE=""; fi
            gh release create "$TAG" --repo "$REPO" --draft $PRE \
              --title "$TAG" \
              --notes "shannon-agent $TAG — automated release (draft until publish)."
            echo "created draft release $TAG"
          fi

  # ───────────────────────────── Rust CLI (cargo build) ────────────────────
  # Builds only `shannon-cli` (bin `shannon`). Its dependency closure contains
  # NO desktop/tauri/gtk crate, so no GUI system libraries are needed — the
  # CLI job skips the webkit/gtk apt install entirely. Archived + sha256'd and
  # uploaded into the pre-created draft with --clobber (idempotent on re-runs).
  cli:
    name: shannon cli (${{ matrix.target }})
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
        with:
          key: cli-${{ matrix.target }}

      # Windows release builds ship with desktop automation (`computer`
      # tool: enigo Win32 + xcap GDI) and the built-in CDP browser tools
      # enabled — both compile clean on Windows (ci.yml check legs + local
      # verification). Linux keeps plain defaults (libxdo system dep);
      # macOS ships defaults until its QA matrix lands.
      - name: Build CLI
        shell: bash
        run: |
          FEATURES=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            FEATURES="--features computer-use,local-browser"
          fi
          cargo build --release -p shannon-cli --target ${{ matrix.target }} $FEATURES

      - name: Package + upload CLI (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          ART="shannon-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "$ART" shannon
          # shasum is the portable choice: present on macOS (built-in) and
          # on Linux runners (ships with Perl). macOS has no sha256sum.
          shasum -a 256 "$ART" > "${ART}.sha256"
          gh release upload "$TAG" "$ART" "${ART}.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Package + upload CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = $env:GITHUB_REF_NAME
          $Target = "${{ matrix.target }}"
          $Art = "shannon-$Target.zip"
          Compress-Archive -Path "target/$Target/release/shannon.exe" -DestinationPath $Art
          $Hash = (Get-FileHash $Art -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Art" | Out-File -Encoding ascii "$Art.sha256"
          gh release upload $Tag $Art "$Art.sha256" --clobber --repo $env:GITHUB_REPOSITORY

  # ───────────────────────────── Desktop (Tauri) ───────────────────────────
  # Reuses the draft created by `create-release` (tauri-action's
  # getOrCreateRelease finds it and uploads — no creation, no race). No
  # releaseName so the unified release keeps its tag-name title.
  desktop:
    name: shannon-desktop (${{ matrix.target }}-${{ matrix.ext }})
    needs: [create-release, cli]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: deb
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: rpm
          # Universal Linux artifact: bundles webkit2gtk/pipewire etc., runs
          # on any glibc >= 2.35 distro (Arch/Fedora/non-deb derivatives) —
          # the distro-agnostic counterpart to the deb/rpm pair.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: appimage
          - target: x86_64-apple-darwin
            os: macos-14
            ext: dmg
          - target: aarch64-apple-darwin
            os: macos-14
            ext: dmg
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: nsis
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
        with:
          key: desktop-${{ matrix.target }}-${{ matrix.ext }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Setup Node + pnpm
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 24
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10

      - name: Install UI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile

      # ── B1 (ADR-0011): stage the CLI binary as a Tauri externalBin ───────
      # Every desktop bundle ships `shannon` alongside the GUI. The cli job
      # has already uploaded the platform archive into the draft release;
      # pull the one matching this matrix target and place it at
      # desktop/binaries/shannon-<target-triple>[.exe] — the naming that
      # bundle.externalBin ("binaries/shannon") expects. Running --version
      # doubles as a smoke check on the exact bytes being bundled.
      - name: Stage bundled CLI (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          TMP="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" -D "$TMP" \
            -p "shannon-${TARGET}.tar.gz" --repo "$GITHUB_REPOSITORY"
          tar -C "$TMP" -xzf "$TMP/shannon-${TARGET}.tar.gz"
          mkdir -p desktop/binaries
          cp "$TMP/shannon" "desktop/binaries/shannon-${TARGET}"
          chmod +x "desktop/binaries/shannon-${TARGET}"
          "./desktop/binaries/shannon-${TARGET}" --version

      - name: Stage bundled CLI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Target = "${{ matrix.target }}"
          $Tmp = Join-Path $env:TEMP "cli-bundle"
          New-Item -ItemType Directory -Force -Path $Tmp | Out-Null
          gh release download $env:GITHUB_REF_NAME -D $Tmp `
            -p "shannon-$Target.zip" --repo $env:GITHUB_REPOSITORY
          Expand-Archive -Path "$Tmp\shannon-$Target.zip" -DestinationPath $Tmp -Force
          New-Item -ItemType Directory -Force -Path desktop\binaries | Out-Null
          Copy-Item "$Tmp\shannon.exe" "desktop\binaries\shannon-$Target.exe" -Force
          & "desktop\binaries\shannon-$Target.exe" --version

      # tauri-bundler downloads NSIS on-demand with NO retry — a transient
      # "io: Peer disconnected" mid-build sinks the whole release job (cost
      # ~20 min per flake on v0.10.0). Pre-fetch + extract into Tauri's cache
      # dir so the bundler finds it ready and skips the fragile download.
      # Mirrors get_and_extract_nsis in
      # tauri-bundler/src/bundle/windows/nsis/mod.rs (nsis-3.11 + utils v0.5.3).
      - name: Pre-cache NSIS toolchain (defeat download flake)
        if: matrix.ext == 'nsis'
        shell: pwsh
        run: |
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $tools 'NSIS'
          if (Test-Path $nsis) {
            Write-Host "NSIS toolchain already cached at $nsis"
          } else {
            New-Item -ItemType Directory -Force -Path $tools | Out-Null
            $zip = Join-Path $tools 'nsis-3.11.zip'
            $dll = Join-Path $tools 'nsis_tauri_utils.dll'
            # --retry-all-errors survives transient Azure-blob disconnects
            curl.exe -L --retry 5 --retry-all-errors --retry-delay 2 -o "$zip" `
              'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip'
            curl.exe -L --retry 5 --retry-all-errors --retry-delay 2 -o "$dll" `
              'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll'
            # SHA1 from tauri-bundler NSIS_SHA1 / NSIS_TAURI_UTILS_SHA1
            if ((Get-FileHash $zip -Algorithm SHA1).Hash -ne 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D') { throw 'nsis-3.11.zip SHA1 mismatch' }
            if ((Get-FileHash $dll -Algorithm SHA1).Hash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') { throw 'nsis_tauri_utils.dll SHA1 mismatch' }
            Expand-Archive -Path $zip -DestinationPath $tools -Force
            Rename-Item (Join-Path $tools 'nsis-3.11') 'NSIS'
            $plugDir = Join-Path $nsis 'Plugins\x86-unicode\additional'
            New-Item -ItemType Directory -Force -Path $plugDir | Out-Null
            Copy-Item $dll (Join-Path $plugDir 'nsis_tauri_utils.dll') -Force
            Write-Host "NSIS toolchain pre-cached at $nsis"
          }

      # productName is `shannon-desktop`, so bundles are shannon-desktop_*.
      # releaseDraft:true only creates if missing — the draft from
      # create-release already exists, so this just uploads into it.
      - name: Build & upload Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage leg: linuxdeploy is itself an AppImage — extract-and-run
          # avoids needing FUSE on the runner; NO_STRIP skips strip calls that
          # can fail on already-stripped bundled libs.
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.ext == 'appimage' && '1' || '' }}
          NO_STRIP: ${{ matrix.ext == 'appimage' && '1' || '' }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}  # rc/beta/alpha (dash) -> prerelease
          # Windows bundles ship with desktop automation + built-in browser
          # tools compiled in (matches the bundled CLI's features); other
          # platforms keep default features.
          args: >-
            --target ${{ matrix.target }} --bundles ${{ matrix.ext }}
            ${{ matrix.ext == 'nsis' && '--features computer-use,local-browser' || '' }}

      # Release hardening (WP-15 follow-up): the deb hard-links pipewire/spa/
      # gbm/EGL/wayland since preview-capture shipped; a package that installs
      # but dies at launch must not reach users. Runs after upload on purpose —
      # the artifact only lands in a DRAFT here, and the draft is flipped to
      # published manually after CI is green, so a red gate still blocks the
      # release.
      - name: Runtime dependency gate (deb @ ubuntu:22.04 floor)
        if: runner.os == 'Linux' && matrix.ext == 'deb'
        run: |
          DEB=$(find target -path '*/release/bundle/deb/*.deb' | head -1)
          test -n "$DEB" || { echo "no deb bundle found under target/"; exit 1; }
          ./scripts/check-deb-runtime-deps.sh "$DEB" --distro ubuntu:22.04

      # rpm has no container gate (the Fedora runtime differs from the build
      # host); list its NEEDED sonames so drift vs the declared rpm depends is
      # at least visible in the run log.
      - name: rpm NEEDED audit (informational)
        if: runner.os == 'Linux' && matrix.ext == 'rpm'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rpm2cpio cpio
          RPM=$(find target -path '*/release/bundle/rpm/*.rpm' | head -1)
          test -n "$RPM" || { echo "no rpm bundle found under target/"; exit 1; }
          rm -rf /tmp/rpmroot && mkdir -p /tmp/rpmroot
          rpm2cpio "$RPM" | cpio -id -D /tmp/rpmroot
          echo "declared rpm depends: gtk3 webkit2gtk4.1 pipewire-libs mesa-libgbm mesa-libEGL libwayland-client"
          readelf -d /tmp/rpmroot/usr/bin/shannon-desktop | grep NEEDED

  # ───────────────────────────── Gateway (Bun) ─────────────────────────────
  # softprops find-or-creates; the draft already exists (create-release), so
  # it uploads into it. draft:true keeps it a draft until `publish`.
  gateway:
    name: shannon-gateway (${{ matrix.target }})
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-22.04
            artifact: shannon-gateway-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-22.04
            artifact: shannon-gateway-linux-arm64
          - target: bun-darwin-x64
            os: macos-14
            artifact: shannon-gateway-darwin-x64
          - target: bun-darwin-arm64
            os: macos-14
            artifact: shannon-gateway-darwin-arm64
          - target: bun-windows-x64
            os: windows-latest
            artifact: shannon-gateway-windows-x64.exe
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install deps
        working-directory: gateway
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: gateway
        run: bun run typecheck

      - name: Test
        # Skipped on bun-windows-x64: the gateway secrets test relies on a
        # keyring backend that is not available on the windows-latest runner
        # (pre-existing latent issue surfaced by adding the windows matrix
        # entry — tracked separately for a proper Windows keyring fix).
        if: matrix.target != 'bun-windows-x64'
        working-directory: gateway
        run: bun run test

      - name: Build binary
        # The build script uses bash multi-line syntax (line continuations,
        # `set -euo pipefail`) that doesn't parse on the windows-latest
        # runner's default pwsh shell. Pin to bash for cross-shell parity.
        shell: bash
        working-directory: gateway
        run: |
          set -euo pipefail
          bun build --compile \
            --target="$TARGET" \
            --outfile="dist/$ARTIFACT" \
            src/index.ts
          ls -la dist/
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}

      - name: Upload gateway binary to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: gateway/dist/${{ matrix.artifact }}
          fail_on_unmatched_files: false

  # ───────────────────────────── Publish release ───────────────────────────
  # The ONLY job that flips the release from draft -> published. Generates a
  # SHA256SUMS over all binary/installer assets (excluding the per-asset
  # .sha256 sidecars), attaches install.sh/install.ps1 + SHA256SUMS, then
  # mirrors everything to Cloudflare R2 (guarded by vars.R2_BUCKET). With
  # create-release guaranteeing a single release, the publish flip can no
  # longer hit the `already_exists` collision that aborted rc2.
  publish:
    name: publish release ${{ github.ref_name }}
    needs: [cli, desktop, gateway]
    if: success()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Download all release assets
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" -D release-assets --repo "$GITHUB_REPOSITORY"
          ls -la release-assets

      - name: Smoke-test release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # rc tags ship core-version binaries (see the prep guard) — asset
          # names and version greps use the numeric core.
          CORE="${VERSION%%-*}"
          # Build success ≠ shippable assets. Assert the load-bearing assets
          # exist with the expected (versioned) names, then run what can run
          # natively on this runner.
          for a in \
            shannon-x86_64-unknown-linux-gnu.tar.gz \
            shannon-x86_64-pc-windows-msvc.zip \
            shannon-x86_64-apple-darwin.tar.gz \
            shannon-aarch64-apple-darwin.tar.gz \
            shannon-gateway-linux-x64 \
            shannon-gateway-darwin-arm64 \
            shannon-gateway-windows-x64.exe \
            "shannon-desktop_${CORE}_amd64.deb" \
            "shannon-desktop_${CORE}_x64-setup.exe" \
            "shannon-desktop_${CORE}_x64.dmg"; do
            [ -f "release-assets/$a" ] || { echo "::error::missing expected asset: $a"; exit 1; }
          done
          echo "asset presence: OK (10/10)"
          # CLI: the linux-x64 tarball runs natively here.
          mkdir -p /tmp/smoke
          tar -C /tmp/smoke -xzf release-assets/shannon-x86_64-unknown-linux-gnu.tar.gz
          GOT="$(/tmp/smoke/shannon --version)"
          echo "shannon --version → $GOT"
          echo "$GOT" | grep -F "$CORE" || {
            echo "::error::CLI reports wrong version (want $CORE)"; exit 1; }
          # Desktop: deb metadata must carry the same version.
          DEB_VER="$(dpkg-deb -f "release-assets/shannon-desktop_${CORE}_amd64.deb" Version)"
          echo "deb Version → $DEB_VER"
          echo "$DEB_VER" | grep -F "$CORE" || {
            echo "::error::deb reports wrong version (want $CORE)"; exit 1; }
          echo "smoke tests passed"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          # Every binary/installer asset, but not the per-asset .sha256
          # sidecars (checksums-of-checksums add no value) nor this file.
          find . -type f ! -name '*.sha256' -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Attach installers + checksum, then publish
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="$GITHUB_REPOSITORY"
          # Attach the unified installer scripts + checksum manifest to the
          # existing draft (created by create-release).
          gh release upload "$TAG" \
            scripts/install.sh scripts/install.ps1 release-assets/SHA256SUMS \
            --clobber --repo "$REPO"
          # Flip the existing draft -> published, IN PLACE. softprops
          # action-gh-release@v2 with draft:false instead CREATES a second
          # published release and then collides with already_exists (this
          # aborted both rc2 and rc4). `gh release edit` targets the tagged
          # release directly — no find-or-create, no duplicate. The prerelease
          # flag is already set by create-release and preserved by edit.
          gh release edit "$TAG" --draft=false --repo "$REPO"
          echo "published $TAG"

      - name: Upload to Cloudflare R2
        if: vars.R2_BUCKET != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npm install -g wrangler@4.98.0
          VERSION="${{ github.ref_name }}"
          BUCKET="${{ vars.R2_BUCKET }}"
          # Prerelease tags (anything with a dash: -rc/-beta/…) must NOT
          # overwrite the stable latest/ mirror — GitHub's releases/latest
          # skips prereleases, but R2 has no such semantics.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease tag $VERSION — mirroring under \$VERSION/ only (latest/ untouched)"
            UPDATE_LATEST=""
          else
            UPDATE_LATEST=1
          fi
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            wrangler r2 object put "$BUCKET/$VERSION/$base" --file "$f"
            if [ -n "$UPDATE_LATEST" ]; then
              wrangler r2 object put "$BUCKET/latest/$base" --file "$f"
            fi
          done
          wrangler r2 object put "$BUCKET/$VERSION/install.sh" --file scripts/install.sh
          wrangler r2 object put "$BUCKET/$VERSION/install.ps1" --file scripts/install.ps1
          if [ -n "$UPDATE_LATEST" ]; then
            wrangler r2 object put "$BUCKET/latest/install.sh" --file scripts/install.sh
            wrangler r2 object put "$BUCKET/latest/install.ps1" --file scripts/install.ps1
          fi
