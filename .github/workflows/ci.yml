name: CI
on:
  push:
    branches: [main, dev]
    # Release tags must pass the full CI gate too — release.yml itself only
    # typechecks/tests the gateway, so without this a tag on an un-CI'd
    # commit ships straight to production.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main, dev]

# Cancel in-progress runs for the same ref when a new commit is pushed.
# Keeps CI queue short on active branches (e.g. dev) without affecting main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Pinned commit SHAs for supply-chain hardening. Bump by replacing the SHA
# with the newer one from `git ls-remote <repo> refs/heads/main` (or the
# release tag's commit). Never use a moving tag like `@v4` for these —
# always pin to an exact commit.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo build --workspace
      - name: Build with computer-use feature
        run: cargo build -p shannon-tools --features computer-use
      - name: Compile tests
        run: cargo test --workspace --no-run
      - name: Test
        # `--profile ci` activates the `.config/nextest.toml` [profile.ci]
        # settings: per-test retries (2, exponential backoff) so known
        # load-sensitive tests (e.g. the byte-exact session-log tee mock
        # round-trip) don't fail the whole gate on a runner hiccup.
        run: cargo nextest run --workspace --config-file .config/nextest.toml --profile ci
      - name: Doctests
        # nextest does not execute doctests, so a doctest-only regression
        # (e.g. an example that relies on opt-in configuration) stays green
        # in `Test` and only fails here. Lib targets are already compiled by
        # the steps above; this only builds the doctest binaries.
        run: cargo test --workspace --doc

  eval-dry-run:
    # W1 §7① PR quick gate (design: docs/plans/2026-08-28-eval-system-design.md):
    # the zero-API-key dry-run rehearsal of the L1 suite (`just eval`) plus
    # the eval-harness unit tests. This gates the EVAL ASSETS themselves —
    # task TOMLs parse/validate, the runner + assertion vocabulary + rule
    # table don't regress, dry_run stubs stay in sync. Real-model capability
    # is deliberately NEVER a PR gate (cost, variance, flakiness).
    # Standalone on purpose: no `needs:` coupling and a bounded timeout, so
    # a GHA cold-cache stall (known runner flake) can be retried in
    # isolation without re-running the rest of CI.
    name: Eval Dry-Run Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install just
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: just
      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-nextest
      - name: Eval dry-run suite (no API key)
        # `just eval` = cargo run -p shannon-core --example eval_runner
        # (dry-run stub executor over the full tests/eval/tasks suite;
        # exits non-zero when any rehearsal fails).
        run: just eval
      - name: Eval CLI entry
        # The user-facing `shannon eval` subcommand (crates/shannon-cli) must
        # stay in sync with the suite: list parses every task, and a single
        # dry-run task rehearses the full CLI run path.
        run: |
          cargo run -q -p shannon-cli -- eval run --list
          cargo run -q -p shannon-cli -- eval run --task read_01
      - name: Eval harness tests
        run: cargo nextest run -p shannon-core -E 'test(eval)' --profile ci

  vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: "24"
      - name: Install dependencies
        run: cd editors/vscode && npm install
      - name: Compile
        run: cd editors/vscode && npm run compile
      - name: Test
        run: cd editors/vscode && npm test

  desktop-e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: "24"
      # pnpm/action-setup v6.0.10, pinned by commit SHA (see header note).
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10
      - name: Install UI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: desktop/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        # playwright.config.ts starts the dev server via `pnpm demo`
        # (VITE_MOCK_MODE=1) so the suite runs without the Tauri backend.
        # CI=1 keeps Playwright from reusing a local server instance.
        working-directory: desktop/ui
        env:
          CI: "1"
        run: pnpm exec playwright test

  desktop-visual-audit:
    name: Desktop Visual Audit (walkthrough)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10
      - name: Install UI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: desktop/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Build UI (mock mode)
        working-directory: desktop/ui
        env:
          VITE_MOCK_MODE: "1"
        run: pnpm build
      - name: Full-page axe walkthrough (13 routes x 2 themes)
        # e2e/walkthrough.spec.ts screenshots every main route under
        # material + tokyo-night and fails on any critical/serious axe
        # violation. Serves the production build via `vite preview`
        # (playwright.walkthrough.config.ts) — no dev server needed.
        working-directory: desktop/ui
        env:
          WALKTHROUGH: "1"
          VITE_MOCK_MODE: "1"
          CI: "1"
        run: pnpm exec playwright test -c playwright.walkthrough.config.ts

  desktop-unit:
    name: Desktop Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: "24"
      # pnpm/action-setup v6.0.10, pinned by commit SHA (see header note).
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10
      - name: Install UI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile
      - name: Lint (tsc + eslint)
        # `pnpm lint` is tsc --noEmit + eslint --max-warnings 0 — the
        # cap is the frozen ESLint budget (ratcheted 72→71→46→23→0 across
        # the 2026-08-26 audit, R10, R11 and B1; all consistent-type-imports
        # have been migrated to top-level `import type`); raise only with
        # ed sign-off.
        working-directory: desktop/ui
        run: pnpm lint
      - name: Overlay whitelist check
        # R2's tripwire against hand-rolled `fixed inset-0` overlays —
        # see desktop/ui/scripts/check-overlays.sh for the whitelist.
        working-directory: desktop/ui
        run: bash scripts/check-overlays.sh
      - name: Theme source drift check
        # src/theme/generated/{themes.css,registry.ts} must match
        # scripts/theme-source.json — blocks hand-edits to generated files.
        working-directory: desktop/ui
        run: node scripts/generate-themes.mjs --check
      - name: Theme contrast audit
        # WCAG 2.x AA check over every [data-theme] token block in the
        # generated themes.css (scripts/contrast-audit.mjs) — fails on any
        # pair below 4.5:1 (text) / 3:1 (UI).
        working-directory: desktop/ui
        run: node scripts/contrast-audit.mjs
      - name: Run unit tests
        # `pnpm test` is vitest in watch mode; `vitest run` is the one-shot
        # form. CI=1 keeps workers deterministic. --coverage enforces the
        # vitest.config.ts thresholds (80/75/60/80; actual 83.28/80.64/
        # 69.44/83.28 after D1 excluded the demo mock layer) — before D1
        # these thresholds were checked only by a local `pnpm test:coverage`.
        working-directory: desktop/ui
        env:
          CI: "1"
        run: pnpm exec vitest run --coverage

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
          components: clippy
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Clippy
        run: >
          cargo clippy --workspace --
          -D warnings
          -A unknown-lints
          -A clippy::collapsible_if
          -A clippy::collapsible_match
          -A clippy::derivable_impls
          -A clippy::manual_is_multiple_of
          -A clippy::manual_checked_div
          -A clippy::unwrap_used
          -A clippy::unnecessary_sort_by

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  # ADR-0011 red line 1: the headless `shannon` CLI must never link GUI
  # libraries. Metadata-only check (no compile) — fails the moment
  # shannon-cli grows a tauri/webkit dependency edge.
  guard-headless:
    name: Headless purity (ADR-0011)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - name: Headless purity check
        run: scripts/check-headless-purity.sh

  audit:
    name: Dependency Audit
    # Required-for-merge gate on `dev` and `main`. Tracks `deny.toml`:
    # license allowlist + curated advisory ignores for transitive crates
    # whose upstream fix is blocked on Tauri / plist / syntax ecosystem.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - name: Install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-deny
      - name: Check dependencies
        run: cargo deny check --hide-inclusion-graph

  rustsec-audit:
    # Required-for-merge gate on `dev` and `main`. RustSec advisory DB
    # covers vulnerabilities not in the Open Rust Database that
    # cargo-deny reads (rustsec.org advisory-db is the broader feed).
    # `cargo-audit` is pinned in the step rather than installed via
    # the global toolchain so the binary itself is reproducible.
    # The --locked flag ensures we install the exact version that
    # gated the merge — no surprise upgrades mid-run.
    name: RustSec Advisory Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # The ignore list lives in `.cargo/audit.toml` (cargo-audit 0.22+
        # discovers project config there, NOT at the repo root — moving it
        # back silently re-enables every suppressed advisory). It mirrors
        # `deny.toml`'s `[advisories].ignore`; keep the two in sync.
        # `--deny warnings` escalates unsound/unmaintained informational
        # advisories to errors; the ignored IDs are each vetted as
        # non-exploitable + ecosystem-blocked (see audit.toml rationale).
        run: cargo audit --deny warnings

  doc:
    # Required-for-merge gate. The workspace's intra-doc-link debt (~96
    # errors across 11 crates) was fixed in the P2-4 CI cleanup; the job
    # then ran one more cycle with `continue-on-error: true` while the
    # eval-era doc comments landed, was repaired again (2026-09-04, commit
    # 95d90224), and the team confirmed the flip. Keep new doc comments
    # link-clean: broken intra-doc links fail the build here before they
    # ship to docs.rs.
    name: Doc Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Build docs
        # `--no-deps` skips documenting the entire ecosystem; we only
        # care about our own intra-doc links. `RUSTDOCFLAGS="-D warnings"`
        # upgrades doc warnings to compile-time errors.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  metrics:
    name: Generate Metrics
    runs-on: ubuntu-latest
    needs: [test, clippy, audit, rustsec-audit]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri + libdbus system deps
        if: runner.os == 'Linux'
        # `cargo test --workspace --no-run` (next step) compiles every
        # workspace member, including shannon-desktop (Tauri → needs
        # webkit2gtk/gtk headers) and shannon-mcp-saas (keyring →
        # libdbus-sys → needs libdbus-1-dev). This step mirrors the
        # system-deps install in the test/clippy/doc jobs; without it the
        # metrics job cannot compile and the required check stays red.
        # The job was previously skipped (its `needs:` were failing), so
        # this gap only surfaced once RustSec Audit went green.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf libdbus-1-dev
      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-nextest
      - name: Install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-deny
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Compile tests (required for nextest list)
        run: cargo test --workspace --no-run
      - name: Generate docs/metrics.md
        run: bash scripts/gen-metrics.sh
      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metrics-report
          path: docs/metrics.md
          if-no-files-found: error

  cross-platform:
    # Required-for-merge gate on `dev` and `main` for the three primary
    # targets (ubuntu, macos, windows). Catches platform-conditional
    # code drift (#[cfg(target_os=...)], #[cfg(target_family=...)])
    # before a release build fails on a maintainer's laptop. We
    # only run `cargo check` (not build) per matrix leg — full builds
    # already run in release.yml — so the cost stays bounded.
    name: Cross-platform Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      # shannon-desktop is excluded below, but shannon-mcp-saas still
      # pulls in `keyring` → `dbus-secret-service` → `dbus` →
      # `libdbus-sys`, whose build.rs runs `pkg-config --libs dbus-1`.
      # On Linux that needs the dev headers; macOS/Windows use the
      # native keychain backends and skip dbus entirely.
      - name: Install libdbus headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev
      - name: Check workspace (all platforms)
        # shannon-desktop requires Tauri/webview system libs that are
        # difficult to install on `windows-latest` and `macos-latest`
        # runners; check the rest of the workspace there for a smoke
        # test of the public Rust API surface. shannon-desktop is
        # built fully in release.yml under each platform's matrix leg.
        run: cargo check --workspace --exclude shannon-desktop
      - name: Check landlock feature (Linux only)
        # The optional landlock feature is off by default, so nothing else
        # compiles it — it rotted for months with 12 errors before #71.
        # landlock is a Linux-only LSM; the feature is meaningless on the
        # other matrix legs.
        if: runner.os == 'Linux'
        run: cargo check -p shannon-core --features landlock

  check-linux-musl:
    # Linux-only musl smoke test. Renamed from `check-cross-platform` so
    # the new `cross-platform` matrix is the obvious OS-coverage gate
    # and this job reads as what it actually does: confirm the workspace
    # still compiles against the statically-linked musl libc target.
    # `continue-on-error: true` because musl-portable webkit/gtk deps
    # are blocked upstream — see shannon-desktop exclude below.
    name: Linux musl Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - name: Install targets
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl cross-compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps (musl)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf
      # shannon-desktop depends on Tauri/webkit2gtk-4.1 which is not musl-portable.
      # shannon-mcp-saas depends on keyring → libdbus-sys, whose C build
      # cannot cross-compile to musl without a musl-linked libdbus (not
      # packaged on ubuntu). Cross-compile the remaining workspace as a
      # smoke test.
      - name: Check Linux x86_64 musl
        run: cargo check --workspace --exclude shannon-desktop --exclude shannon-mcp-saas --target x86_64-unknown-linux-musl

  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    # Semver is a required gate (flipped from advisory in the v0.8.0 cycle).
    # Previously advisory because breaking changes are routine before 1.0 — they
    # remain allowed as long as the minor version bumps (0.8.x -> 0.9.0);
    # cargo-semver-checks enforces this by default.
    #  - baseline-rev (a git tag) replaces the default crates.io lookup because
    #    the `shannon-cli` crate name is squatted on crates.io.
    #  - The v0.8.0 baseline contains all workspace crates, retiring the earlier
    #    six-crate exclude (crates absent from the v0.5.5 baseline). shannon-desktop
    #    stays excluded: it is a Tauri binary whose rustdoc needs GTK/WebKit system
    #    deps this job does not install, and its public API is not consumed
    #    externally (application crate, not a library).
    env:
      # Bump this when cutting a new baseline release. It feeds both
      # `baseline-rev` and the cache `prefix-key`, so a baseline bump always
      # invalidates the cached baseline rustdoc and never serves a stale one.
      SEMVER_BASELINE: v0.10.0
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Install libdbus headers
        # shannon-mcp-saas → keyring → libdbus-sys needs pkg-config +
        # libdbus-1-dev at build time (also needed for the baseline rustdoc).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev
      - name: Check semver (baseline rustdoc cached)
        uses: obi1kenobi/cargo-semver-checks-action@eac29787462b0f1957d618a21f458305db73b36c
        with:
          baseline-rev: ${{ env.SEMVER_BASELINE }}
          prefix-key: baseline-${{ env.SEMVER_BASELINE }}
          # No rust-toolchain pin: the action defaults to latest stable, which
          # cargo-semver-checks (>=0.48) requires (rustc >=1.91 for its rustdoc
          # format). The repo-wide 1.88 pin is intentionally not used here.
          feature-group: default-features
          exclude: shannon-desktop
          verbose: true

  insta:
    # P2-3 (improvement plan §P2-3): snapshot discipline. Runs the workspace
    # nextest suite (which exercises every insta snapshot test) and then
    # fails if any `.snap.new` files are left over. The `.snap.new` files
    # are what `insta::assert_snapshot!` writes when an assertion fails —
    # leaving them in the tree means a contributor shipped a snapshot
    # change without explicitly accepting it. See docs/plans/insta-workflow.md.
    # Required-for-merge on `dev` and `main`: a snapshot drift blocks the
    # same way the underlying test would.
    name: Insta Snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-nextest
      - name: Run workspace tests (exercises snapshot tests)
        # Arch-invariants tests are guarded by `cargo test` integration
        # discovery; running nextest covers the same set in addition to
        # the bin/lib unit tests, so a single invocation is enough.
        # `--profile ci` mirrors the Test job (retries for load-sensitive
        # tests; a retried-then-passing snapshot test leaves no .snap.new).
        run: cargo nextest run --workspace --config-file .config/nextest.toml --profile ci
      - name: Reject pending snapshots
        # If any `.snap.new` file exists, the snapshot test recorded a
        # diff the contributor did not accept. Fail the build so the PR
        # cannot merge until the snapshot is reviewed and accepted
        # locally (see docs/plans/insta-workflow.md).
        run: |
          if find . -path ./target -prune -o -name '*.snap.new' -print | grep -q .; then
            echo "Pending insta snapshots detected — review with 'cargo insta review':"
            find . -path ./target -prune -o -name '*.snap.new' -print
            exit 1
          fi
