name: CI
on:
  push:
    branches: [main, dev]
    # Release tags must pass the full CI gate too — release.yml itself only
    # typechecks/tests the gateway, so without this a tag on an un-CI'd
    # commit ships straight to production.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run-browser-e2e:
        description: "Run the real-Chrome browser E2E test (installs headless Chrome)"
        type: boolean
        default: false
        required: false

# Cancel in-progress runs for the same ref when a new commit is pushed.
# Keeps CI queue short on active branches (e.g. dev) without affecting main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Pinned commit SHAs for supply-chain hardening. Bump by replacing the SHA
# with the newer one from `git ls-remote <repo> refs/heads/main` (or the
# release tag's commit). Never use a moving tag like `@v4` for these —
# always pin to an exact commit.
jobs:
  facade-facts:
    name: Facade facts & hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Generated facade facts are fresh
        run: node scripts/gen-facts.mjs --check
      - name: No stale/banned phrases in facade surfaces
        run: bash scripts/check-facade.sh
  test:
    name: Test
    runs-on: ubuntu-latest
    # review §P3-E2: hang-on-build job would burn 6 hours of runner quota
    # without a hard cap. 60 min is generous for our 11.7k-test suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
        with:
          # Bump to invalidate caches that predate the feature-isolated
          # target dir (a stale cache carried feature-ON shannon-tools test
          # binaries into the feature-OFF workspace run).
          prefix-key: ci-v2
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libgbm-dev libdrm-dev libpipewire-0.3-dev patchelf
      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo build --workspace
      - name: Compile tests
        run: cargo test --workspace --no-run
      - name: Test
        # `--profile ci` activates the `.config/nextest.toml` [profile.ci]
        # settings: per-test retries (2, exponential backoff) so known
        # load-sensitive tests (e.g. the byte-exact session-log tee mock
        # round-trip) don't fail the whole gate on a runner hiccup.
        #
        # On failure the repro lines + output tail are re-emitted as
        # ::error:: annotations — the only failure detail readable through
        # the public API without an authenticated log download.
        run: |
          set -o pipefail
          # Guard against stale cached binaries with unexpected feature sets.
          cargo clean -p shannon-tools
          if cargo nextest run --workspace --config-file .config/nextest.toml --profile ci 2>&1 | tee /tmp/nextest-test.log; then
            exit 0
          fi
          status=$?
          repros=$(grep -E "TRY 3 FAIL" /tmp/nextest-test.log | cut -c1-160 | sed 's/%/%25/g;s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g' | cut -c1-3600)
          echo "::error::nextest repros (TRY 3 FAIL): ${repros:-none captured}"
          tail=$(tail -25 /tmp/nextest-test.log | cut -c1-160 | sed 's/%/%25/g;s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g' | cut -c1-3600)
          echo "::error::nextest output tail: ${tail:-none captured}"
          exit $status
      # Feature-gated builds/tests (downscale_dims, click_spec, key combos,
      # libei backend). Runs AFTER the main gate, in an ISOLATED target dir:
      # sharing `target/` with feature-OFF steps leaked the enabled feature
      # into the workspace nextest build (the `computer` stub tests took the
      # real-execution path on the displayless runner).
      - name: Build with computer-use feature
        run: |
          CARGO_TARGET_DIR=target-feature cargo build -p shannon-tools --features computer-use
          # CLI passthrough feature (opt-in desktop automation build)
          CARGO_TARGET_DIR=target-feature cargo build -p shannon-cli --features computer-use
      - name: Test with computer-use feature
        # Only the computer module matters here (feature-off stub tests are
        # cfg-gated out; the full lib run would drag in HOME-race git tests
        # into a target dir without the nextest retry profile).
        run: CARGO_TARGET_DIR=target-feature cargo test -p shannon-tools --features computer-use --lib computer --no-fail-fast
      # T10 Phase 1: compile-check the Wayland-capable backend (libei via
      # xdg-desktop-portal). Pure-Rust deps (reis/ashpd) — no extra system
      # packages needed at build time; the portal is only a runtime dep.
      - name: Build with computer-use-libei feature
        run: CARGO_TARGET_DIR=target-feature cargo build -p shannon-tools --features computer-use-libei
      # T14 Phase 1: compile-check the live browser tools. No browser is
      # installed on the runner, so only the compile gate runs here; the
      # E2E integration test self-skips when no browser is detected.
      - name: Build with local-browser feature
        run: CARGO_TARGET_DIR=target-feature cargo build -p shannon-tools --features local-browser
      # T14 Phase 3: REAL end-to-end browser test — installs headless
      # Chrome, then drives the session layer (launch → navigate →
      # screenshot → key press → console buffer → close) exactly as the
      # builtin tools do. Manual trigger from the Actions tab.
      - name: E2E with local-browser feature (real Chrome)
        if: inputs.run-browser-e2e == true
        continue-on-error: true
        run: |
          # Headless Chrome needs its deps; the runner image already has
          # most. `--no-sandbox` is set by the session layer.
          CARGO_TARGET_DIR=target-feature cargo test -p shannon-tools \
            --features local-browser --test browser_e2e -- --nocapture
      - name: Doctests
        # nextest does not execute doctests, so a doctest-only regression
        # (e.g. an example that relies on opt-in configuration) stays green
        # in `Test` and only fails here. Lib targets are already compiled by
        # the steps above; this only builds the doctest binaries.
        run: cargo test --workspace --doc

  eval-dry-run:
    # W1 §7① PR quick gate (design: docs/plans/2026-08-28-eval-system-design.md):
    # the zero-API-key dry-run rehearsal of the L1 suite (`just eval`) plus
    # the eval-harness unit tests. This gates the EVAL ASSETS themselves —
    # task TOMLs parse/validate, the runner + assertion vocabulary + rule
    # table don't regress, dry_run stubs stay in sync. Real-model capability
    # is deliberately NEVER a PR gate (cost, variance, flakiness).
    # Standalone on purpose: no `needs:` coupling and a bounded timeout, so
    # a GHA cold-cache stall (known runner flake) can be retried in
    # isolation without re-running the rest of CI.
    name: Eval Dry-Run Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install just
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: just
      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-nextest
      - name: Eval dry-run suite (no API key)
        # `just eval` = cargo run -p shannon-core --example eval_runner
        # (dry-run stub executor over the full tests/eval/tasks suite;
        # exits non-zero when any rehearsal fails).
        run: just eval
      - name: Eval CLI entry
        # The user-facing `shannon eval` subcommand (crates/shannon-cli) must
        # stay in sync with the suite: list parses every task, and a single
        # dry-run task rehearses the full CLI run path.
        run: |
          cargo run -q -p shannon-cli -- eval run --list
          cargo run -q -p shannon-cli -- eval run --task read_01
      - name: Eval harness tests
        run: cargo nextest run -p shannon-core -E 'test(eval)' --profile ci

  desktop-e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: "24"
      # pnpm/action-setup v6.0.10, pinned by commit SHA (see header note).
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10
      - name: Install UI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: desktop/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        # playwright.config.ts starts the dev server via `pnpm demo`
        # (VITE_MOCK_MODE=1) so the suite runs without the Tauri backend.
        # CI=1 keeps Playwright from reusing a local server instance.
        working-directory: desktop/ui
        env:
          CI: "1"
        run: pnpm exec playwright test

  desktop-visual-audit:
    name: Desktop Visual Audit (walkthrough)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10
      - name: Install UI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: desktop/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Build UI (mock mode)
        working-directory: desktop/ui
        env:
          VITE_MOCK_MODE: "1"
        run: pnpm build
      - name: Full-page axe walkthrough (13 routes x 2 themes)
        # e2e/walkthrough.spec.ts screenshots every main route under
        # material + tokyo-night and fails on any critical/serious axe
        # violation. Serves the production build via `vite preview`
        # (playwright.walkthrough.config.ts) — no dev server needed.
        working-directory: desktop/ui
        env:
          WALKTHROUGH: "1"
          VITE_MOCK_MODE: "1"
          CI: "1"
        run: pnpm exec playwright test -c playwright.walkthrough.config.ts

  desktop-unit:
    name: Desktop Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: "24"
      # pnpm/action-setup v6.0.10, pinned by commit SHA (see header note).
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10
      - name: Install UI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile
      - name: Lint (tsc + eslint)
        # `pnpm lint` is tsc --noEmit + eslint --max-warnings 0 — the
        # cap is the frozen ESLint budget (ratcheted 72→71→46→23→0 across
        # the 2026-08-26 audit, R10, R11 and B1; all consistent-type-imports
        # have been migrated to top-level `import type`); raise only with
        # ed sign-off.
        working-directory: desktop/ui
        run: pnpm lint
      - name: Overlay whitelist check
        # R2's tripwire against hand-rolled `fixed inset-0` overlays —
        # see desktop/ui/scripts/check-overlays.sh for the whitelist.
        working-directory: desktop/ui
        run: bash scripts/check-overlays.sh
      - name: Design-token guard
        # UI audit §6.1 acceptance: retired dual-track terms must never
        # reappear in src, and raw palette classes / hard-coded hex are
        # blocked in favour of theme tokens. Already invoked by pnpm lint
        # too — duplicated here so CI logs identify the failure clearly.
        working-directory: desktop/ui
        run: node scripts/check-design-tokens.mjs
      - name: Theme source drift check
        # src/theme/generated/{themes.css,registry.ts} must match
        # scripts/theme-source.json — blocks hand-edits to generated files.
        working-directory: desktop/ui
        run: node scripts/generate-themes.mjs --check
      - name: Theme contrast audit
        # WCAG 2.x AA check over every [data-theme] token block in the
        # generated themes.css (scripts/contrast-audit.mjs) — fails on any
        # pair below 4.5:1 (text) / 3:1 (UI).
        working-directory: desktop/ui
        run: node scripts/contrast-audit.mjs
      - name: Run unit tests
        # `pnpm test` is vitest in watch mode; `vitest run` is the one-shot
        # form. CI=1 keeps workers deterministic. --coverage enforces the
        # vitest.config.ts thresholds (80/75/60/80; actual 83.28/80.64/
        # 69.44/83.28 after D1 excluded the demo mock layer) — before D1
        # these thresholds were checked only by a local `pnpm test:coverage`.
        working-directory: desktop/ui
        env:
          CI: "1"
        run: pnpm exec vitest run --coverage

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
          components: clippy
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libgbm-dev libdrm-dev libpipewire-0.3-dev patchelf
      - name: Clippy
        run: >
          cargo clippy --workspace --
          -D warnings
          -A unknown-lints
          -A clippy::collapsible_if
          -A clippy::collapsible_match
          -A clippy::derivable_impls
          -A clippy::manual_is_multiple_of
          -A clippy::manual_checked_div
          -A clippy::unwrap_used
          -A clippy::unnecessary_sort_by

  # review §P1-E1: ci.yml previously claimed in a header comment that it
  # typechecked/tested the gateway but had no such job. Without this, a
  # red `tsc --noEmit` on dev (we observed TS2352 in protocolSchema.test.ts
  # when we started) could ship to main. Now runs pnpm typecheck + vitest
  # on every PR touching gateway/.
  gateway:
    name: Gateway (TS typecheck + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install gateway deps
        working-directory: gateway
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: gateway
        run: pnpm typecheck
      - name: Test
        working-directory: gateway
        run: pnpm test

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  # ADR-0011 red line 1: the headless `shannon` CLI must never link GUI
  # libraries. Metadata-only check (no compile) — fails the moment
  # shannon-cli grows a tauri/webkit dependency edge.
  guard-headless:
    name: Headless purity (ADR-0011)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - name: Headless purity check
        run: scripts/check-headless-purity.sh

  audit:
    name: Dependency Audit
    # Required-for-merge gate on `dev` and `main`. Tracks `deny.toml`:
    # license allowlist + curated advisory ignores for transitive crates
    # whose upstream fix is blocked on Tauri / plist / syntax ecosystem.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - name: Install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-deny
      - name: Check dependencies
        run: cargo deny check --hide-inclusion-graph

  rustsec-audit:
    # Required-for-merge gate on `dev` and `main`. RustSec advisory DB
    # covers vulnerabilities not in the Open Rust Database that
    # cargo-deny reads (rustsec.org advisory-db is the broader feed).
    # `cargo-audit` is pinned in the step rather than installed via
    # the global toolchain so the binary itself is reproducible.
    # The --locked flag ensures we install the exact version that
    # gated the merge — no surprise upgrades mid-run.
    name: RustSec Advisory Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # The ignore list lives in `.cargo/audit.toml` (cargo-audit 0.22+
        # discovers project config there, NOT at the repo root — moving it
        # back silently re-enables every suppressed advisory). It mirrors
        # `deny.toml`'s `[advisories].ignore`; keep the two in sync.
        # `--deny warnings` escalates unsound/unmaintained informational
        # advisories to errors; the ignored IDs are each vetted as
        # non-exploitable + ecosystem-blocked (see audit.toml rationale).
        run: cargo audit --deny warnings

  doc:
    # Required-for-merge gate. The workspace's intra-doc-link debt (~96
    # errors across 11 crates) was fixed in the P2-4 CI cleanup; the job
    # then ran one more cycle with `continue-on-error: true` while the
    # eval-era doc comments landed, was repaired again (2026-09-04, commit
    # 95d90224), and the team confirmed the flip. Keep new doc comments
    # link-clean: broken intra-doc links fail the build here before they
    # ship to docs.rs.
    name: Doc Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libgbm-dev libdrm-dev libpipewire-0.3-dev patchelf
      - name: Build docs
        # `--no-deps` skips documenting the entire ecosystem; we only
        # care about our own intra-doc links. `RUSTDOCFLAGS="-D warnings"`
        # upgrades doc warnings to compile-time errors.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  metrics:
    name: Generate Metrics
    runs-on: ubuntu-latest
    needs: [test, clippy, audit, rustsec-audit]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri + libdbus system deps
        if: runner.os == 'Linux'
        # `cargo test --workspace --no-run` (next step) compiles every
        # workspace member, including shannon-desktop (Tauri → needs
        # webkit2gtk/gtk headers) and shannon-mcp-saas (keyring →
        # libdbus-sys → needs libdbus-1-dev). This step mirrors the
        # system-deps install in the test/clippy/doc jobs; without it the
        # metrics job cannot compile and the required check stays red.
        # The job was previously skipped (its `needs:` were failing), so
        # this gap only surfaced once RustSec Audit went green.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libgbm-dev libdrm-dev libpipewire-0.3-dev patchelf libdbus-1-dev
      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-nextest
      - name: Install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-deny
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Compile tests (required for nextest list)
        run: cargo test --workspace --no-run
      - name: Generate docs/metrics.md
        run: bash scripts/gen-metrics.sh
      - name: README metrics drift check
        # README metrics markers are hand-copied from the generated report;
        # fail when they drift from the fresh numbers.
        run: bash scripts/gen-metrics.sh --check
      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: metrics-report
          path: docs/metrics.md
          if-no-files-found: error

  cross-platform:
    # Required-for-merge gate on `dev` and `main` for the three primary
    # targets (ubuntu, macos, windows). Catches platform-conditional
    # code drift (#[cfg(target_os=...)], #[cfg(target_family=...)])
    # before a release build fails on a maintainer's laptop. We
    # only run `cargo check` (not build) per matrix leg — full builds
    # already run in release.yml — so the cost stays bounded.
    name: Cross-platform Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      # shannon-desktop is excluded below, but shannon-mcp-saas still
      # pulls in `keyring` → `dbus-secret-service` → `dbus` →
      # `libdbus-sys`, whose build.rs runs `pkg-config --libs dbus-1`.
      # On Linux that needs the dev headers; macOS/Windows use the
      # native keychain backends and skip dbus entirely.
      - name: Install system headers (Linux only)
        if: runner.os == 'Linux'
        # libdbus-1-dev: keyring → dbus-secret-service (shannon-mcp-saas).
        # libgbm-dev/libdrm-dev/libwayland-dev/libpipewire-0.3-dev/libegl-dev:
        # xcap's Linux capture stack (xcap → libwayshot-xcap → gbm →
        # wayland-backend → wayland-sys, khronos-egl[static] pkg-config
        # probe "egl", plus pipewire/libspa-sys) — without these the
        # computer-use feature legs below die in build.rs panics. Same set
        # the Test/Clippy jobs already install for the same dependency chain.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libgbm-dev libdrm-dev libwayland-dev libpipewire-0.3-dev libegl-dev
      - name: Check workspace (all platforms)
        # shannon-desktop requires Tauri/webview system libs that are
        # difficult to install on `windows-latest` and `macos-latest`
        # runners; check the rest of the workspace there for a smoke
        # test of the public Rust API surface. shannon-desktop is
        # built fully in release.yml under each platform's matrix leg.
        run: cargo check --workspace --exclude shannon-desktop
      - name: Check landlock feature (Linux only)
        # The optional landlock feature is off by default, so nothing else
        # compiles it — it rotted for months with 12 errors before #71.
        # landlock is a Linux-only LSM; the feature is meaningless on the
        # other matrix legs.
        if: runner.os == 'Linux'
        run: cargo check -p shannon-core --features landlock
      - name: Check computer-use feature (macOS only)
        # xcap 0.0.13's macOS backend didn't compile on the pinned rustc
        # 1.88 (E0282) and no leg noticed: the computer-use build gate lives
        # in the Linux-only feature job, and this matrix's macOS leg checks
        # default features only. Keep the macOS capture path compiling.
        if: runner.os == 'macOS'
        run: cargo check -p shannon-tools --features computer-use
      - name: Check computer-use + local-browser features (Windows only)
        # Windows release artifacts ship with these features enabled
        # (release.yml), yet before 2026-09 no CI leg ever compiled them on
        # Windows — the enigo Win32 / xcap GDI / chromiumoxide CDP surface
        # was verified nowhere. Both shapes must keep compiling.
        if: runner.os == 'Windows'
        run: |
          cargo check -p shannon-tools --features computer-use,local-browser
          cargo check -p shannon-cli --features computer-use,local-browser
      - name: Check all features (Linux only)
        # Feature-universe compile: --all-features unions optional deps no
        # default-features gate ever sees. Three carve-outs, each with its
        # own legs below: shannon-desktop (Tauri system deps, built in
        # release.yml), shannon-tools + shannon-cli — the latter forwards
        # shannon-tools' computer-use input backends, which are mutually
        # exclusive by design (compile_error!s), so `--workspace
        # --all-features` can never hold for them even with --exclude
        # (feature unification follows dependency edges, not the member
        # list). The member list is jq-driven so new crates join
        # automatically. shannon-server's swagger feature uses
        # utoipa-swagger-ui/vendored so this stays network-free and
        # deterministic.
        if: runner.os == 'Linux'
        run: |
          for p in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | grep -vx -e shannon-desktop -e shannon-tools -e shannon-cli); do
            cargo check -p "$p" --all-features
          done
      # One step per feature shape so a red run names the exact shape that
      # broke instead of a 10-command blob (the 2026-09-21 dev red took a
      # full static-audit pass because the failing command was unlogged).
      # libxdo-dev: enigo's default Linux backend needs libxdo headers on
      # a fresh runner (cargo check type-checks the FFI surface); jq is
      # needed by the per-member loop above and this job has no other
      # step installing it.
      - name: Install computer-use check deps (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq libxdo-dev
      - name: Check computer-use (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo check -p shannon-tools --features computer-use
          cargo check -p shannon-cli --features computer-use
      - name: Check computer-use-libei (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo check -p shannon-tools --features computer-use-libei
          cargo check -p shannon-cli --features computer-use-libei
      - name: Check computer-use-wayland (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo check -p shannon-tools --features computer-use-wayland
          cargo check -p shannon-cli --features computer-use-wayland
      - name: Check computer-use-x11rb (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo check -p shannon-tools --features computer-use-x11rb
          cargo check -p shannon-cli --features computer-use-x11rb
      - name: Check computer-use-wayland-capture (Linux only)
        # This is the shape that went red on dev while every other leg
        # stayed green; the rustc error tail is re-emitted as a ::error::
        # annotation so the failure is diagnosable through the public
        # check-runs API without an authenticated log download.
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          if cargo check -p shannon-tools --features computer-use-wayland-capture 2>&1 | tee /tmp/wc-alone.log; then
            echo "wayland-capture alone: OK"
          else
            tail=$(tail -30 /tmp/wc-alone.log | cut -c1-160 | sed 's/%/%25/g;s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g' | cut -c1-3600)
            echo "::error::wayland-capture (alone) error tail: ${tail:-none captured}"
            exit 1
          fi
          if cargo check -p shannon-tools --features computer-use-wayland,computer-use-wayland-capture 2>&1 | tee /tmp/wc-combined.log; then
            echo "wayland+wayland-capture combined: OK"
          else
            tail=$(tail -30 /tmp/wc-combined.log | cut -c1-160 | sed 's/%/%25/g;s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g' | cut -c1-3600)
            echo "::error::wayland+wayland-capture (combined) error tail: ${tail:-none captured}"
            exit 1
          fi
      - name: Check local-browser (Linux only)
        if: runner.os == 'Linux'
        run: cargo check -p shannon-tools --features local-browser

  check-linux-musl:
    # Linux-only musl smoke test. Renamed from `check-cross-platform` so
    # the new `cross-platform` matrix is the obvious OS-coverage gate
    # and this job reads as what it actually does: confirm the workspace
    # still compiles against the statically-linked musl libc target.
    # `continue-on-error: true` because musl-portable webkit/gtk deps
    # are blocked upstream — see shannon-desktop exclude below.
    name: Linux musl Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - name: Install targets
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl cross-compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps (musl)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libgbm-dev libdrm-dev libpipewire-0.3-dev patchelf
      # shannon-desktop depends on Tauri/webkit2gtk-4.1 which is not musl-portable.
      # shannon-mcp-saas depends on keyring → libdbus-sys, whose C build
      # cannot cross-compile to musl without a musl-linked libdbus (not
      # packaged on ubuntu). Cross-compile the remaining workspace as a
      # smoke test.
      - name: Check Linux x86_64 musl
        run: cargo check --workspace --exclude shannon-desktop --exclude shannon-mcp-saas --target x86_64-unknown-linux-musl

  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    # Semver is a required gate (flipped from advisory in the v0.8.0 cycle).
    # Previously advisory because breaking changes are routine before 1.0 — they
    # remain allowed as long as the minor version bumps (0.8.x -> 0.9.0);
    # cargo-semver-checks enforces this by default.
    #  - baseline-rev (a git tag) replaces the default crates.io lookup because
    #    the `shannon-cli` crate name is squatted on crates.io.
    #  - The v0.8.0 baseline contains all workspace crates, retiring the earlier
    #    six-crate exclude (crates absent from the v0.5.5 baseline). shannon-desktop
    #    stays excluded: it is a Tauri binary whose rustdoc needs GTK/WebKit system
    #    deps this job does not install, and its public API is not consumed
    #    externally (application crate, not a library).
    env:
      # Interim fix (2026-09-09): v0.10.0 predates shannon-browser /
      # shannon-remote, and cargo-semver-checks cannot build a baseline
      # rustdoc for workspace crates absent from the baseline revision
      # ("no `package` table" → retrieval failure) — the gate has been
      # red on dev for this reason. `semver-baseline-2026-09` is a tag on
      # a dev commit containing every workspace crate; move it forward
      # (or bump to the next release tag) when new crates land. It feeds
      # both `baseline-rev` and the cache `prefix-key`, so a baseline bump
      # always invalidates the cached baseline rustdoc and never serves a
      # stale one.
      # Second move (2026-09-09, PR #85): shannon-plugin-api (the
      # secret-guard contract crate) is a new workspace member absent from
      # semver-baseline-2026-09 — same "no package table" retrieval
      # failure class. New TAG NAME (not a re-point) so the prefix-key
      # cache invalidates.
      # Third move (2026-09-16, c10cf94d): WP-15 added a `Thinking` variant to
      # WsServerMessage (shannon-api-protocol) and reshaped query-engine
      # internals — intentional minor-cycle breaks. New TAG NAME so the
      # baseline-rustdoc cache invalidates.
      # Fourth move (2026-09-18, f1e1e2f5): WP-15 T5 added an optional `name`
      # field to ModelInfo (shannon-api-protocol) — intentional minor-cycle
      # break (new pub field on an exhaustively-constructible struct). New TAG
      # NAME so the baseline-rustdoc cache invalidates.
      # Fifth move (2026-09-18, 758e33be, PR #89): ZCode delta added optional
      # `running`/`updated_at` to SessionInfo and `meta`/`tokens_used` to
      # ToolResultPayload (shannon-types) — same intentional minor-cycle
      # break class. New TAG NAME so the baseline-rustdoc cache invalidates.
      # Sixth move (2026-09-19, PR #94 B2-1): Teammate 真回复 — added a new
      # trailing `executor: Option<Arc<dyn AgentExecutor>>` parameter to
      # `shannon_agents::AgentCoordinator::add_teammate` (3 → 4 args). This
      # is a method-parameter-count bump on a publicly-visible method on the
      # public coordinator type — semver-major by definition, but additive
      # in practice: every external caller can pass `None` and recover the
      # exact pre-PR behaviour. New TAG NAME so the baseline-rustdoc cache
      # invalidates.
      # Seventh move (2026-09-22, harness-arch review waves merged to dev):
      # cc2bacc4 (P0-7) added `max_turns: Option<u32>` to
      # `shannon_agents::agent_defs::AgentDefinition` (P0-7 sub-agent
      # max_turns override) — new pub field on an exhaustively-constructible
      # struct, intentional minor-cycle break. New TAG NAME so the
      # baseline-rustdoc cache invalidates.
      # Eighth move (2026-09-22, PR #97 comprehensive review): review §P1-6
      # restores ConversationUpdate payload into the engine on WS (additive
      # public event consumption), §P2-14 adds `apply_conflicts: bool` to
      # `shannon_tools::file::edit::EditInput` (new pub field on an
      # exhaustively-constructible struct), §P2-15 adds
      # `FileSystemProvider::rename_blocking` (new trait method,
      # additive). All three are intentional minor-cycle breaks pre-1.0.
      # New TAG NAME so the baseline-rustdoc cache invalidates.
      SEMVER_BASELINE: semver-baseline-2026-09-8
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Install libdbus + Tauri system deps
        # shannon-mcp-saas → keyring → libdbus-sys needs pkg-config +
        # libdbus-1-dev at build time (also needed for the baseline rustdoc).
        # Tauri deps (libwebkit2gtk/gtk3/...) are needed because the CURRENT
        # workspace's rustdoc pass builds shannon-desktop's dependency tree
        # (glib-sys build script) even when the crate itself is excluded from
        # comparison — the v0.10.0 baseline had no desktop crate, but the
        # current one does (Insta job installs the same set for the same
        # reason).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libgbm-dev libdrm-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libgbm-dev libdrm-dev libpipewire-0.3-dev patchelf
      - name: Check semver (baseline rustdoc cached)
        uses: obi1kenobi/cargo-semver-checks-action@eac29787462b0f1957d618a21f458305db73b36c
        with:
          baseline-rev: ${{ env.SEMVER_BASELINE }}
          prefix-key: baseline-${{ env.SEMVER_BASELINE }}
          # No rust-toolchain pin: the action defaults to latest stable, which
          # cargo-semver-checks (>=0.48) requires (rustc >=1.91 for its rustdoc
          # format). The repo-wide 1.88 pin is intentionally not used here.
          feature-group: default-features
          # shannon-browser / shannon-remote are new crates absent from the
          # v0.10.0 baseline — cargo-semver-checks cannot load a baseline
          # manifest for them ("no `package` table"); they join the exclude
          # list until the next baseline tag.
          # NOTE (2026-09-18): this input is COMMA-separated (space-separated
          # silently matched nothing, so shannon-desktop was being semver-
          # checked despite the documented exclusion — it is a Tauri binary
          # crate whose public API is not consumed externally).
          exclude: shannon-desktop,shannon-browser,shannon-remote
          verbose: true

  insta:
    # P2-3 (improvement plan §P2-3): snapshot discipline. Runs the workspace
    # nextest suite (which exercises every insta snapshot test) and then
    # fails if any `.snap.new` files are left over. The `.snap.new` files
    # are what `insta::assert_snapshot!` writes when an assertion fails —
    # leaving them in the tree means a contributor shipped a snapshot
    # change without explicitly accepting it. See docs/plans/insta-workflow.md.
    # Required-for-merge on `dev` and `main`: a snapshot drift blocks the
    # same way the underlying test would.
    name: Insta Snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libgbm-dev libdrm-dev libpipewire-0.3-dev patchelf
      - name: Install nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-nextest
      - name: Run workspace tests (exercises snapshot tests)
        # Arch-invariants tests are guarded by `cargo test` integration
        # discovery; running nextest covers the same set in addition to
        # the bin/lib unit tests, so a single invocation is enough.
        # `--profile ci` mirrors the Test job (retries for load-sensitive
        # tests; a retried-then-passing snapshot test leaves no .snap.new).
        # Failure details are re-emitted as ::error:: annotations (public
        # API readable — see the Test job note).
        run: |
          set -o pipefail
          if cargo nextest run --workspace --config-file .config/nextest.toml --profile ci 2>&1 | tee /tmp/nextest-insta.log; then
            exit 0
          fi
          status=$?
          repros=$(grep -E "TRY 3 FAIL" /tmp/nextest-insta.log | cut -c1-160 | sed 's/%/%25/g;s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g' | cut -c1-3600)
          echo "::error::nextest repros (TRY 3 FAIL): ${repros:-none captured}"
          tail=$(tail -25 /tmp/nextest-insta.log | cut -c1-160 | sed 's/%/%25/g;s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g' | cut -c1-3600)
          echo "::error::nextest output tail: ${tail:-none captured}"
          exit $status
      - name: Reject pending snapshots
        # If any `.snap.new` file exists, the snapshot test recorded a
        # diff the contributor did not accept. Fail the build so the PR
        # cannot merge until the snapshot is reviewed and accepted
        # locally (see docs/plans/insta-workflow.md).
        run: |
          if find . -path ./target -prune -o -name '*.snap.new' -print | grep -q .; then
            echo "Pending insta snapshots detected — review with 'cargo insta review':"
            find . -path ./target -prune -o -name '*.snap.new' -print
            exit 1
          fi
