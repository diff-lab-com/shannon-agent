name: Desktop Package Preview

# P2 (2026-09-25 CI review): desktop Tauri bundling (deb/NSIS/dmg/...) is
# only exercised in release.yml, so a packaging break surfaces at release
# time. This weekly preview builds the Linux deb leg end-to-end (the bundle
# with the extra runtime gate in release) so packaging drift surfaces
# within a week. workflow_dispatch for on-demand checks.
on:
  schedule:
    - cron: '0 6 * * 6' # Weekly Saturday 6am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb-preview:
    name: Build deb bundle (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
        with:
          key: desktop-preview
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Setup Node + pnpm
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 24
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10
      - name: Install UI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile
      - name: Build bundled CLI (externalBin)
        # release.yml stages the CLI from the release draft; the preview
        # builds it locally — same externalBin path the bundle expects
        # (desktop/binaries/shannon-<target-triple>, see ADR-0011 B1).
        run: |
          cargo build --release -p shannon-cli
          mkdir -p desktop/binaries
          cp target/release/shannon desktop/binaries/shannon-x86_64-unknown-linux-gnu
          ./desktop/binaries/shannon-x86_64-unknown-linux-gnu --version
      - name: Build deb bundle (no release upload)
        # No tagName/releaseId input: tauri-action builds the bundle and
        # exits without touching any GitHub Release.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles deb
      - name: Upload deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-deb-preview
          path: target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error
