name: Nightly Coverage

on:
  schedule:
    - cron: '0 5 * * *'  # Daily 5am UTC
  workflow_dispatch:

# Same group scheme as ci.yml. A nightly never preempts another run of
# itself, so cancel-in-progress stays off (matching publish/release and the
# schedule-triggered workflows; review F57).
concurrency:
  group: Nightly Coverage-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Action refs are pinned to full commit SHAs (same pins as ci.yml) per the
# supply-chain hardening note at the top of ci.yml: never use a moving tag.
# codecov/codecov-action SHA = the v4 release tag's commit.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33
      - name: Install Tauri system deps
        # Mirrors ci.yml Test/metrics jobs — the coverage build compiles every
        # workspace member including shannon-mcp-saas (keyring →
        # dbus-secret-service → libdbus-sys → pkg-config probe for dbus-1) and
        # the xcap capture stack (gbm/drm/pipewire headers), so a subset list
        # fails here even though the plain Test job's targets compile.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libgbm-dev libdrm-dev \
            libpipewire-0.3-dev patchelf libdbus-1-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-nextest
      - name: Generate coverage
        # Run via cargo-nextest with the repo's `ci` profile (R7,
        # 2026-10-01): llvm-cov's instrumentation amplifies timing-
        # sensitive tests the same way V8 amplification breaks the UI
        # coverage nightly — three consecutive nightly failures (from
        # 2026-09-29) were three DIFFERENT tests each night (shannon-tools
        # git tests, then the api_server query-budget test), i.e. flaky
        # under instrumentation, not broken tests. nextest's ci profile
        # (retries=2, exponential backoff) absorbs that class; in nextest
        # mode `--profile ci` passes through to cargo-nextest (llvm-cov's
        # build profile knob is --cargo-profile). The ci profile also
        # terminates tests at 3x the 60s slow threshold, bounding a hung
        # test instead of stalling the nightly.
        run: cargo llvm-cov nextest --workspace --profile ci --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: lcov.info
          fail_ci_if_error: false
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  desktop-coverage:
    name: Desktop UI coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: "24"
      # pnpm/action-setup v6.0.10, pinned by commit SHA (see ci.yml header).
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10
      - name: Install UI deps
        working-directory: desktop/ui
        run: pnpm install --frozen-lockfile
      - name: Unit tests with coverage
        # The vitest.config.ts threshold gate (80/75/60/80) is enforced
        # HERE since 2026-10-01 — moved off the PR gate's Desktop Unit job,
        # which paid ~13.5 min/run for V8 instrumentation (P3 of the CI
        # speed plan). Tradeoff, accepted by review: a coverage regression
        # surfaces on this nightly (or any manual dispatch) at most a day
        # late instead of blocking the desktop PR that caused it.
        #
        # ChatInputApprovalMode is EXCLUDED from this run only: under V8
        # instrumentation the Base UI select callbacks in ChatInput amplify
        # (same mechanism as the tooltip.prim.tsx exclusion in
        # vitest.config.ts) and the file's real-timer polling loop starved
        # the whole event loop — the 2026-10-01 06:14 dispatch saw the
        # 60s test timeout fire 15 minutes into the run. The test still
        # runs on the PR gate (uninstrumented), so behaviour coverage is
        # not lost; only this threshold run skips it.
        working-directory: desktop/ui
        env:
          CI: "1"
        run: pnpm exec vitest run --coverage --exclude 'src/__tests__/ChatInputApprovalMode.test.tsx'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-ui-coverage
          path: desktop/ui/coverage/
          retention-days: 30
