name: Metrics

# Regenerates docs/metrics.md on every push to main and dev, and on demand.
# The single authoritative metrics source for the project (test counts,
# line counts, clippy / cargo-deny status). On PRs the workflow uploads
# docs/metrics.md as an artifact so reviewers can inspect the diff without
# needing to commit it back to the PR branch.
#
# On `main` and `dev` the workflow auto-commits any change to docs/metrics.md
# so the baseline stays current without a manual PR.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# No two metrics runs on the same ref should race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metrics:
    name: Generate metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so git rev-parse / git describe in the script work.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cloc

      - name: Run metrics generator
        run: bash scripts/gen-metrics.sh

      - name: Show diff
        if: always()
        run: |
          if git diff --quiet docs/metrics.md; then
            echo "docs/metrics.md unchanged"
          else
            echo "---- docs/metrics.md diff ----"
            git diff --stat docs/metrics.md
            git diff docs/metrics.md || true
          fi

      - name: Commit update (push to main/dev only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          if git diff --quiet docs/metrics.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics.md
          git commit -m "chore(metrics): regenerate docs/metrics.md [skip ci]"
          git push

      - name: Upload artifact (PR runs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: docs/metrics.md
          retention-days: 14
