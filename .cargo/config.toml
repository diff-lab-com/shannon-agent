# Limit parallel compilation to cap peak memory at ~8Gi.
# jobs=4 pairs with the dev/test profile settings (codegen-units=2,
# debug="line-tables-only") that live in the root Cargo.toml — cargo
# silently ignores [profile.*] tables in config files; profiles only load
# from the workspace root manifest (they lived here by mistake until
# 2026-09-28).
[build]
jobs = 4
