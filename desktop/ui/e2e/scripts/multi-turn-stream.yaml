# ChatScript: multi-turn-stream — journey #2（矩阵#2）。
#
# 两轮对话：第一轮 60 个分片的长文本（中英混排），断言气泡文本 === chunks
# 拼接（无丢字/重复）、流式中 stick-to-bottom（视口贴底、无 scroll-to-latest
# FAB）、第二轮 send 后 player turnIndex 递增（query_id q-1）。断言在
# spec（chat-script.multi-turn-stream.spec.ts）。
#
# chunkDelayMs 30 × 60 ≈ 1.8s 流式窗口，留给贴底轮询。
name: multi-turn-stream
description: 两轮流式 — 60 分片长文本 + 气泡拼接断言 + 贴底 + 第二轮 q-id 递增
