# ChatScript: dock-interactions — journey #20（W2 §9.4，gap G8+G9）。
#
# 右侧 Dock 旅程：seed 会话带 workingDir（驱动 PlanPanel 的 get_session_plan）
# 与 write_file 工具历史（FileCard 的 "Review changes" → Diff 停靠源）+ html
# fence（产物 chip → 交互注册失败降级静态 hint）。断言在 spec
# （chat-script.dock.spec.ts）：
#   - 键盘调宽（←/→ 各 16px）+ clamp（280-720，60% 视口上限）；
#   - 全屏进出；关 dock 自动退全屏；shannon.dock.* 持久化 reload 恢复；
#   - Ctrl+\ 一次性 hint（dock-shortcut-hint）出现后选 tab 即 dismiss；
#   - 自动停靠四源钉两个：计划模式进入 → plan tab；Diff 点击 → diff tab；
#   - PlanPanel 人工勾选 → save_text_file 写回（get_session_plan 服务写回
#     内容，勾选在 refresh 后存活）；失败注入（config.saveTextFileFails，
#     spec 用 loadChatScriptObject 变体）回滚到引擎真相。
name: dock-interactions
description: Dock 旅程 — 键盘调宽/全屏/持久化/hint；计划模式与 Diff 自动停靠；PlanPanel 勾选写回与失败回滚；html 产物静态降级
seed:
  config:
    hasKey: true
  sessions:
    - id: script-sess-dock
      title: Dock journey
      workingDir: /Users/demo/workspace/shannon-demo
      messages:
        - role: user
          content: 给我写一个 todo 清单和演示页面
        - role: assistant
          content: |-
            已创建 todo.md 和一个演示页面。

            ```html
            <!doctype html>
            <html>
              <body>
                <h1>Shannon demo</h1>
                <button id="go">click</button>
              </body>
            </html>
            ```
          toolCalls:
            - toolUseId: tool-dock-write-1
              toolName: write_file
              toolInput:
                file_path: /Users/demo/workspace/shannon-demo/todo.md
                content: "buy milk\nwrite tests\nship it"
              result: "wrote 3 lines"
              isError: false
turns:
  - user: "核对计划清单（plan 工具回包应刷新计划面板）"
    script:
      - event: query:text
        chunks:
          - "计划本身没有变化，"
          - "这次只是确认。"
        chunkDelayMs: 200
      # tool_name 含 "plan" → PlanPanel 的事件刷新路径（useSessionPlan 监听）。
      - event: query:tool-start
        payload:
          tool_use_id: tool-dock-plan-1
          tool_name: get_plan_status
          tool_input: {}
      - event: query:tool-result
        payload:
          tool_use_id: tool-dock-plan-1
          tool_name: get_plan_status
          result: "plan pending, 1/3 steps done"
          is_error: false
      # Park so the plan-tab refresh is observable in the spec.
      - waitFor: ui
      - event: query:completed
