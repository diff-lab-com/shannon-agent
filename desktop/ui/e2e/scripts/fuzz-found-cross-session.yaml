# ChatScript: fuzz-found-cross-session — R5 fuzz 收获 F-1 的最小固定复现。
#
# 疑似 bug（未打 knownIssue 标记 — 标记会跳过步骤，而这里每个步骤都必须真实播放）：
#   F-1: query:completed 的 session_id 指向别的会话时，AppContext 的
#   QUERY_COMPLETED 以 `p.session_id ?? visibleKey` 为结算 key ——
#   setSessionQuerying(错误会话, false)，而发送时闩上的是发送会话
#   （sendMessage 里 setSessionQuerying(targetSessionId, true)）。发送会话的
#   querying 锁因此永不释放：stop 按钮常驻、composer 永不复位，直到刷新。
#
# 最小化：文本分片保持默认路由（正常流入当前会话），只有 completed 盖成
# fuzz-sess-b —— 屏幕上是「冻结的流 + 永不复位的 stop」。
#
# 翻转条件（fix 落地后）：completed 改为按 query_id 归属（或回退发送会话）
# 结算 → 把 chat-script.fuzz-found.spec.ts 的楔死断言翻回「composer 复位 +
# 气泡提交」的终态契约，并在疑似 bug 清单里销掉 F-1。
name: fuzz-found-cross-session
description: R5 疑似 bug F-1 — completed 盖错 session_id，发送会话的 composer 锁永不释放
seed:
  config:
    hasKey: true
  sessions:
    - id: fuzz-sess-a
      title: Fuzz A
      messages: []
    - id: fuzz-sess-b
      title: Fuzz B
      messages: []
turns:
  - user: 跑一个终态被错路由的回合
    script:
      - event: query:text
        chunks:
          - "流式文本正常进入当前会话，"
          - "但终态会被盖成别人的 session_id。"
        chunkDelayMs: 120
      - event: query:completed
        payload:
          session_id: fuzz-sess-b
