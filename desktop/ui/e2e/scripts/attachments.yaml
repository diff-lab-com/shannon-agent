# ChatScript: attachments — journey #8（矩阵#8）。
#
# 草稿预置附件（spec 用 addInitScript 写 localStorage `shannon.draft.<id>`）
# → chips 渲染 → 发送 → rejected_attachments 回执 → 每文件一条
# "«file» was not sent: «reason»" toast。回归锚点：R2 走查 P0「附件黑洞」
# 修复——工作目录外的附件必须明示拒收，绝不允许静默丢弃。
#
# A-4 锚点（knownIssue 注释，断言在 spec）：乐观 append 的 user 消息不带
# file_attachments（AppContext sendMessage）——发送后用户气泡短暂没有附件
# 预览。现状断言「无预览」，R4 修复后翻转为「乐观气泡带附件预览」。
name: attachments
description: 附件 journey — 草稿 chips → 发送 → rejected toast（P0 回归锚点）→ 乐观期无附件预览（A-4 锚点）
seed:
  config:
    hasKey: true
  sessions:
    - id: script-sess-attach
      title: Attachments
      messages: []
turns:
  - user: 总结这个文件
    rejectedAttachments:
      - path: /Users/demo/Downloads/outside-notes.md
        reason: out_of_working_dir
    script:
      - event: query:text
        chunks:
          - "收到——不过附件被拒收了："
          - "它在允许的工作目录之外。"
        chunkDelayMs: 250
      - event: query:completed
