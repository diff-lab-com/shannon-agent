# ChatScript: approval-allow — journey #4a（矩阵#4，与 approval-deny 共用 spec）。
#
# 短文本流 → permission-request（Bash / high risk / rule 理由）→ 播放器自动
# 暂停（R1 语义）→ 用户点 Allow Once → respond_permission 落账（snapshot
# permissionLog）→ 播放恢复 → 工具执行 → completed。断言在
# spec（chat-script.approval.spec.ts）。
name: approval-allow
description: 审批 Allow Once — 权限弹窗 → respond_permission 记账 → 恢复 → 工具执行 → completed
seed:
  config:
    hasKey: true
  sessions:
    - id: script-sess-approval
      title: Approval flow
      messages: []
turns:
  - user: "运行 ls -la 看看当前目录里有什么"
    script:
      - event: query:text
        chunks:
          - "我需要先获得你的许可，"
          - "然后运行这条命令。"
        chunkDelayMs: 250
      - event: permission-request
        payload:
          request_id: pr-allow-1
          tool: Bash
          risk: high
          input:
            command: "ls -la"
          reason:
            source: rule
            ruleName: "shell-command"
      - event: query:tool-start
        payload:
          tool_use_id: tool-ls-1
          tool_name: Bash
          tool_input:
            command: "ls -la"
      - event: query:tool-result
        payload:
          tool_use_id: tool-ls-1
          result: "total 0"
          is_error: false
      # Park so the completed tool card is observable in the spec (the
      # remaining steps would otherwise settle within one tick and the card
      # leaves with the run — P2-4 semantics).
      - waitFor: ui
      - event: query:completed
  # ── W2 G22 扩展：risk 四级补 low/medium，reason 三源补 llm/default/legacy ──
  # turn 2：low risk + llm 置信度 reason（Header.tsx 的 llm 分支，四舍五入%）。
  - user: "读取 notes.txt（低风险，分类器判定）"
    script:
      - event: query:text
        chunks: ["读取低风险文件前需要你的许可。"]
        chunkDelayMs: 200
      - event: permission-request
        payload:
          request_id: pr-allow-2
          tool: read_file
          risk: low
          input:
            path: /Users/demo/workspace/notes.txt
          reason:
            source: llm
            confidence: 0.868
      - event: query:tool-result
        payload:
          tool_use_id: tool-read-2
          result: "hello"
          is_error: false
      - waitFor: ui
      - event: query:completed
  # turn 3：medium risk + default reason（无 source 字段 → policy default 分支）。
  - user: "写 build artifact（中风险，无匹配规则）"
    script:
      - event: query:text
        chunks: ["中风险操作需要你的许可。"]
        chunkDelayMs: 200
      - event: permission-request
        payload:
          request_id: pr-allow-3
          tool: write_file
          risk: medium
          input:
            file_path: /Users/demo/workspace/out.txt
          reason:
            source: default
      - event: query:tool-result
        payload:
          tool_use_id: tool-write-3
          result: "ok"
          is_error: false
      - waitFor: ui
      - event: query:completed
  # turn 4：legacy 兼容 —— 无 reason 字段的 payload 不渲染理由行。
  - user: "列目录（legacy 载荷，无 reason）"
    script:
      - event: query:text
        chunks: ["旧版载荷没有 reason 字段。"]
        chunkDelayMs: 200
      - event: permission-request
        payload:
          request_id: pr-allow-4
          tool: Bash
          risk: low
          input:
            command: "pwd"
      - event: query:tool-result
        payload:
          tool_use_id: tool-pwd-4
          result: "/Users/demo"
          is_error: false
      - waitFor: ui
      - event: query:completed
