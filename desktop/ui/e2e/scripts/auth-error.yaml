# ChatScript: auth-error — journey #5a（矩阵#5）。
#
# 2 个分片后 query:failed，payload.error 含 "authentication failed" 措辞
# （后端分类器按措辞分类）且 error_kind:'auth' → 断言 auth 专用横幅
# （auth-error-banner：provider 名 + Settings→Models 深链 + Update key），
# 而非普通错误横幅。断言在 spec（chat-script.errors.spec.ts）。
name: auth-error
description: auth 失败 — error_kind auth → ApiKey 深链横幅而非普通错误横幅
seed:
  config:
    hasKey: true
  sessions:
    - id: script-sess-auth
      title: Auth error
      messages: []
turns:
  - user: "总结一下这个仓库的用途"
    script:
      - event: query:text
        chunks:
          - "这个仓库主要用于…"
          - "（流式中断）"
        chunkDelayMs: 300
      - event: query:failed
        payload:
          error: "Authentication failed: invalid x-api-key (HTTP 401)"
          error_kind: "auth"
