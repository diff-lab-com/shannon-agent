# ChatScript: mid-stream-fail — journey #5b（矩阵#5）。
#
# 第一轮：2 个分片后 query:failed (error_kind:'other') → 普通错误横幅 +
# ComposerRetryButton、无 ghost bubble。点击 Retry → send_message 再次被
# 调用（snapshot().sentTurns === 2 断言）→ 第二轮消费。断言在 spec
# （chat-script.errors.spec.ts）。
#
# 草稿预置附件（spec 用 addInitScript 写 localStorage `shannon.draft.<id>`，
# 同 attachments journey）→ 第一轮发送携带附件，Retry 重发必须保留它。
#
# A-3 已修复（R4 组1）：Retry 重发保留最后一条用户消息的附件——第二轮的
# knownIssue 标记已移除（chunk 步骤恢复执行），spec/L1 断言已翻转为
# 「重发的 send_message 携带原附件路径 + 重试轮正常播放回复」。
name: mid-stream-fail
description: 流中失败 — 横幅 + Retry → 重发（A-3 已修复：附件保留）→ 会话继续
seed:
  config:
    hasKey: true
  sessions:
    - id: script-sess-fail
      title: Mid-stream failure
      messages: []
turns:
  - user: "给我讲一个关于海的故事"
    attachments:
      - "/Users/demo/Downloads/story-notes.md"
    script:
      - event: query:text
        chunks:
          - "从前有一片海，"
          - "海面上…"
        chunkDelayMs: 300
      - event: query:failed
        payload:
          error: "upstream connection reset while streaming"
          error_kind: "other"
  # Retry 轮：ComposerRetryButton 重发最后一条用户消息 + 其附件路径。
  - user: "给我讲一个关于海的故事"
    script:
      - event: query:text
        chunks:
          - "重试后的流式回复"
