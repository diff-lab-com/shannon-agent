# ChatScript: cancel-text-stream — journey #6 子集（矩阵#6，完整 cancel 矩阵在 R3）。
#
# 3 个分片（间隔 5s，流一直挂着）→ 用户点 Stop → onCancel 缺省路径 →
# query:cancelled 收敛：无残留 streaming/光标、stop→send 复位、无失败横幅。
# 「半截文本不落定」是现状丢弃语义（B0 P1-2），以 knownIssue: "A-19" 锚定
# 翻转点（见 onCancel 注释）。断言在 spec（chat-script.cancel.spec.ts）。
name: cancel-text-stream
description: 流中取消 — stop → query:cancelled 收敛 + 半截文本丢弃现状（A-19 锚点）
seed:
  config:
    hasKey: true
  sessions:
    - id: script-sess-cancel
      title: Cancel stream
      messages: []
turns:
  - user: "写一首关于海的长诗，慢慢写"
    script:
      - event: query:text
        chunks:
          - "海浪拍岸，"
          - "月光洒落，"
          - "风起云涌，"
        chunkDelayMs: 5000
# A-19 锚点：现状 cancel 丢弃半截文本（AppContext 的 ghost-bubble 清理）。
# R4 实现「半截文本落定」后：移除下方 knownIssue 标记，并翻转 spec/L1 断言
# 为「cancel 后 assistant 气泡包含已流出的半截文本」。标记跳过执行时播放器
# 兜底仍会发 query:cancelled，行为与缺省路径完全一致。
onCancel:
  emit:
    - event: query:cancelled
      knownIssue: "A-19"
