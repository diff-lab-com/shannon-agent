# ChatScript: search-virtualized — wave-2 G11 扩展（multi-turn-stream spec 的 Ctrl+F 长会话路径）。
#
# 32 条 seed 消息 > VIRTUALIZE_THRESHOLD(30) → MessageArea 走虚拟化列表。
# 稀有 token "needle-42" 放在 index 5（assistant）与 index 28（user），供
# 搜索命中计数 / Enter / Shift+Enter 环游 / 虚拟化跳转断言。断言在 spec
# （chat-script.multi-turn-stream.spec.ts）。
name: search-virtualized
description: 32 条历史消息的虚拟化长会话 — Ctrl+F 搜索跳转与环游
seed:
  config:
    hasKey: true
