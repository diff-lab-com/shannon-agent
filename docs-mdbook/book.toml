[book]
title = "Shannon Documentation"
authors = ["Shannon Contributors"]
description = "The open-source AI agent workspace: terminal to desktop, one Rust engine, any LLM provider. Open source, total control, keys never leave your machine."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
git-repository-url = "https://github.com/diff-lab-com/shannon-agent"
edit-url-template = "https://github.com/diff-lab-com/shannon-agent/edit/dev/docs-mdbook/src/{path}"

[output.html.search]
enable = true
limit-results = 30
