      使い方:
        /config list          - すべての設定を表示
        /config get <キー>     - 特定の値を取得
        /config set <キー> <値> - 値を設定
        /config reset <キー>   - デフォルトにリセット
  hooks:
    none: "フックが設定されていません。"
    reloaded: "フックを正常に再読み込みしました。"
    reload_failed: "フックの再読み込みに失敗しました: %{error}"
  memory:
    usage_remember: "使い方: /remember <記憶させるテキスト>"
