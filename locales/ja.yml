    config_saved: "✓ プロバイダー設定を保存しました: %{path}"
    reusing_key: "• '%{provider}' の保存済みキーを再利用します（サービス: %{service}）"
    cred_verified: "✓ 認証情報を検証しました — '%{model}' はこのキーで到達可能です。"
    auth_failed: "✗ '%{provider}' の認証に失敗しました。キーは保存されましたがプロバイダーに拒否されました — キーを確認して /connect を再実行してください。"
    verify_warning: "⚠ '%{provider}' の認証情報を完全に検証できませんでした（%{error}）。キーは保存済みです。引き続き動作する可能性があります — メッセージの送信を試してください。"
    probe_failed: "⚠ '%{provider}' の認証情報チェックに失敗しました。キーは保存済みです。引き続き動作する可能性があります。"
    switched: "✓ %{provider} に切り替えました — モデル: %{model}（新しい認証情報が有効、再起動は不要です）"
    storing_error: "認証情報の保存エラー: %{error}"
    saving_error: "providers.toml の保存エラー: %{error}"
