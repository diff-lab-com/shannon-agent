# ── Status Messages ────────────────────────────────────────────────────────
status:
  ready: "準備完了"
  processing: "処理中..."
  running: "実行中"
  error: "エラー: %{error}"
  warning: "警告: %{message}"
  loading: "読み込み中..."
  completed: "完了"
  failed: "失敗"
  cancelled_status: "キャンセル"

