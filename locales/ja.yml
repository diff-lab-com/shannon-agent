    set: "◎ 目標を設定しました（最大 %{max} ラウンド）：%{objective}\nメッセージを送ると開始します——Shannon は目標達成まで各ターン後に自動で作業を続けます。/goal pause で一時停止、/goal clear で解除。"
    current: "目標（%{status}、%{iterations}/%{max} ラウンド）：%{objective}"
    current_none: "目標が未設定です。使い方：/goal <目標> | /goal pause | /goal resume | /goal clear"
    cleared: "✓ 目標を解除しました。"
    paused_no_progress: "⏸ 目標を一時停止——進展なし：%{reason}\nストライク：%{strikes}/%{max_strikes}。確認の上 /goal resume（予算リセット）または /goal clear。"
    paused_blocked: "⏸ 目標を一時停止——エージェントがブロックを報告：%{reason}\n解決後に /goal resume で再開、または /goal clear で解除。"
    paused_budget: "⏸ 目標を一時停止——予算上限到達：%{reason}\n/goal <obj> --budget $N で上限を引き上げるか /goal clear。"
    paused_max: "⏸ %{max} ラウンドに達しても完了しなかったため、目標を一時停止しました。/goal resume または /goal clear で続行できます。"
    resumed: "▶ 目標を再開しました（反復回数をリセット）。"
    complete: "✓ 目標達成（%{iterations} ラウンド）：%{objective}"
    conflict_loop: "/ralph または /loop が有効です——先に停止してから /goal を設定してください。"
  connect:
    success: "✓ %{provider} に接続しました"
    choose_model: "以下からモデルを選択してください（Enter = デフォルト、↑↓ = 選択、Esc = デフォルトを使用）。"
    refresh_started: "バックグラウンドでモデルカタログを更新中…"
    refresh_success: "カタログを更新しました — %{count} 個のモデルが利用可能です。"
    refresh_failed: "オフライン — キャッシュされたカタログを使用します。"
