    file_not_found: "ファイルが見つかりません: %{path}"
    read_failed: "ファイルの読み取りに失敗しました: %{error}"
    image_attached: "[画像を添付しました: %{path}]"
    image_sent: "画像をモデルに送信しました。処理中..."
    clipboard_pasted: "[クリップボードから画像を貼り付けました]"
    clipboard_sent: "クリップボードの画像を送信しました。処理中..."
    no_engine: "クエリエンジンが利用できません。"
  notify:
    enabled: "デスクトップ通知を有効にしました。"
    disabled: "デスクトップ通知を無効にしました。"
  sandbox:
    enabled: "サンドボックスモードを有効にしました（Docker分離）。"
    disabled: "サンドボックスモードを無効にしました（直接実行）。"
    not_available: "Dockerが利用できません。サンドボックスモードにはDockerが必要です。"
  team:
    help: |-
      /team create <name> [description]  — 新しいエージェントチームを作成
      /team add <team> <agent-name>  — チームにエージェントを追加
      /team task <team> <subject>  — タスクを追加
      /team assign <team>  — 待機中のタスクを空いているエージェントに割り当て
      /team status [team]  — チームの状態を表示
      /team list  — すべてのチームを一覧表示
      /team run  — 待機中のタスクを並列実行
      /team shutdown  — チームをシャットダウン
      /team disband <team>  — チームを解散してクリーンアップ
      /team delegate  — デリゲートモードを切り替え（リードのみが調整）
  plugin:
    help: |
      プラグイン管理:

        /plugin list                    - インストール済みプラグインを一覧表示
        /plugin search <query>          - プラグインレジストリを検索
        /plugin info <name>             - インデックスからプラグインの詳細を表示
        /plugin install <name-or-url>   - プラグインをインストール
        /plugin uninstall <name>        - プラグインを削除
        /plugin update [name]           - プラグインを更新
        /plugin enable <name>           - プラグインを有効化
        /plugin disable <name>          - プラグインを無効化

      プラグインのソース:
        - レジストリ名（例: "example-plugin"）
        - Git URL（例: "https://github.com/user/plugin"）
        - ローカルパス（例: "/path/to/plugin"）
    installed_title: "インストール済みプラグイン:\n\n"
    none_installed: |-
      プラグインがインストールされていません。

      以下でプラグインをインストールできます:
        /plugin install <name-or-url>
    none_found: "プラグインが見つかりません。別のキーワードで検索してください。"
    search_results_title: "検索結果:\n\n"
    search_results_ranked_title: "検索結果（関連度順）:\n\n"
  doctor:
    title: "Shannon Code 診断\n"
    results_summary: "結果: %{passed} 成功、%{warnings} 警告、%{failed} 失敗\n"
  credentials:
    title: "保存された認証情報:\n\n"
    none: "  保存された認証情報はありません。\n"
    usage: |

      使い方:
        /credentials list              - 保存された認証情報を表示
        /credentials store <svc> <val> - 認証情報を保存
        /credentials get <service>     - 認証情報を取得（マスク済み）
        /credentials delete <service>  - 認証情報を削除
        /credentials count             - 保存された認証情報の数を表示
  session:
    snapshots_title: "保存されたセッションスナップショット:\n\n"
    none_saved: |-
      保存されたセッションスナップショットはありません。
      `/session save <名前>` で作成できます。
    load_hint: "\n`/session load <名前>` でスナップショットを復元できます。"
  debug:
    help: |
      開発者デバッグコマンド:

        /debug log [level]     - ログレベルを設定 (trace|debug|info|warn|error)
        /debug profile start   - パフォーマンスプロファイリングを開始
        /debug profile stop    - プロファイリングを停止して結果を表示
        /debug trace [on|off]  - 実行トレースを切り替え
        /debug info            - システム診断情報を表示

      ログレベル:
        trace - 内部メッセージを含むすべてのメッセージ
        debug - デバッグメッセージ以上
        info  - 通常メッセージ（デフォルト）
        warn  - 警告とエラーのみ
        error - 重大なエラーのみ
    system_info_title: "システム診断:\n\n"
  preset:
    available_title: "利用可能なプリセット:\n\n"
    no_description: "説明なし"
    usage: |

      使い方:
        /preset              - すべてのプリセットを一覧表示
        /preset <名前>       - プリセットを適用
        /preset show <名前>  - プリセットの詳細を表示

