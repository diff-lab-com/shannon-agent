    no_selection: "プロバイダーが選択されていません。先に /connect <provider> <key> を実行してください。"
  disconnect:
    usage: "使い方: /disconnect <provider>\n保存されたプロバイダーの接続（providers.toml のエントリ）を削除し、接続状態を解除します。保存済みのAPIキーは保持されます — 再接続するには /connect を再実行してください。"
