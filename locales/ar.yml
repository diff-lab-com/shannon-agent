    help: |-
      /team create <name> [description]  — إنشاء فريق وكلاء جديد
      /team add <team> <agent-name>  — إضافة وكيل إلى الفريق
      /team task <team> <subject>  — إضافة مهمة
      /team assign <team>  — إسناد المهام المعلقة إلى الوكلاء المتاحين
      /team status [team]  — عرض حالة الفريق
      /team list  — عرض جميع الفرق
      /team run  — تنفيذ المهام المعلقة بالتوازي
      /team shutdown  — إيقاف الفريق
      /team disband <team>  — حلّ الفريق وتنظيفه
      /team delegate  — تبديل وضع التفويض (المنسق فقط ينسق)
  plugin:
    help: |
      إدارة الإضافات:

        /plugin list                    - عرض الإضافات المثبتة
        /plugin search <query>          - البحث في سجل الإضافات
        /plugin info <name>             - عرض تفاصيل الإضافة من الفهرس
        /plugin install <name-or-url>   - تثبيت إضافة
        /plugin uninstall <name>        - إزالة إضافة
        /plugin update [name]           - تحديث الإضافات
        /plugin enable <name>           - تفعيل إضافة
        /plugin disable <name>          - تعطيل إضافة

      مصادر الإضافات:
        - اسم في السجل (مثال "example-plugin")
        - رابط Git (مثال "https://github.com/user/plugin")
        - مسار محلي (مثال "/path/to/plugin")
    installed_title: "الإضافات المثبتة:\n\n"
    none_installed: |-
      لا توجد إضافات مثبتة.

      ثبّت الإضافات باستخدام:
        /plugin install <name-or-url>
    none_found: "لم يتم العثور على إضافات. جرّب استعلام بحث مختلف."
    search_results_title: "نتائج البحث:\n\n"
    search_results_ranked_title: "نتائج البحث (مرتبة حسب الصلة):\n\n"
  doctor:
    title: "تشخيصات Shannon Code\n"
    results_summary: "النتائج: %{passed} ناجحة، %{warnings} تحذيرات، %{failed} فاشلة\n"
  credentials:
    title: "بيانات الاعتماد المخزنة:\n\n"
    none: "  لا توجد بيانات اعتماد مخزنة.\n"
    usage: |

      الاستخدام:
        /credentials list              - عرض بيانات الاعتماد المخزنة
        /credentials store <svc> <val> - تخزين بيانات اعتماد
        /credentials get <service>     - استرداد بيانات اعتماد (مقنعة)
        /credentials delete <service>  - حذف بيانات اعتماد
        /credentials count             - عرض عدد بيانات الاعتماد المخزنة
  session:
    snapshots_title: "لقطات الجلسة المحفوظة:\n\n"
    none_saved: |-
      لا توجد لقطات جلسة محفوظة.
      استخدم `/session save <اسم>` لإنشاء واحدة.
    load_hint: "\nاستخدم `/session load <اسم>` لاستعادة لقطة."
  debug:
    help: |
      أوامر التصحيح للمطورين:

        /debug log [level]     - تعيين مستوى السجل (trace|debug|info|warn|error)
        /debug profile start   - بدء قياس الأداء
        /debug profile stop    - إيقاف القياس وعرض النتائج
        /debug trace [on|off]  - تبديل تتبع التنفيذ
        /debug info            - عرض تشخيصات النظام

      مستويات السجل:
        trace - جميع الرسائل بما فيها الداخلية
        debug - رسائل التصحيح وما فوقها
        info  - الرسائل المعلوماتية (الافتراضي)
        warn  - التحذيرات والأخطاء فقط
        error - الأخطاء الحرجة فقط
    system_info_title: "تشخيصات النظام:\n\n"
  preset:
    available_title: "الإعدادات المسبقة المتاحة:\n\n"
    no_description: "لا يوجد وصف"
    usage: |

      الاستخدام:
        /preset              - عرض جميع الإعدادات المسبقة
        /preset <اسم>       - تطبيق إعداد مسبق
        /preset show <اسم>  - عرض تفاصيل الإعداد المسبق

