  team:
    help: |-
      /team create <name> [description]  — নতুন এজেন্ট দল তৈরি করুন
      /team add <team> <agent-name>  — দলে এজেন্ট যোগ করুন
      /team task <team> <subject>  — একটি কাজ যোগ করুন
      /team assign <team>  — অপেক্ষমাণ কাজগুলো উপলব্ধ এজেন্টদের বরাদ্দ করুন
      /team status [team]  — দলের অবস্থা দেখান
      /team list  — সব দল তালিকাভুক্ত করুন
      /team run  — অপেক্ষমাণ কাজ সমান্তরালে চালান
      /team shutdown  — দল বন্ধ করুন
      /team disband <team>  — দল ভেঙে পরিচ্ছন্নকরণ সম্পন্ন করুন
      /team delegate  — প্রতিনিধি মোড টগল করুন (শুধু লিড সমন্বয় করে)
  plugin:
    help: |
      প্লাগইন ব্যবস্থাপনা:

        /plugin list                    - ইনস্টল করা প্লাগইন তালিকাভুক্ত করুন
        /plugin search <query>          - প্লাগইন রেজিস্ট্রি অনুসন্ধান করুন
        /plugin info <name>             - সূচি থেকে প্লাগইনের বিবরণ দেখান
        /plugin install <name-or-url>   - একটি প্লাগইন ইনস্টল করুন
        /plugin uninstall <name>        - একটি প্লাগইন সরান
        /plugin update [name]           - প্লাগইন আপডেট করুন
        /plugin enable <name>           - একটি প্লাগইন সক্রিয় করুন
        /plugin disable <name>          - একটি প্লাগইন নিষ্ক্রিয় করুন

      প্লাগইনের উৎস:
        - রেজিস্ট্রি নাম (যেমন "example-plugin")
        - Git URL (যেমন "https://github.com/user/plugin")
        - স্থানীয় পথ (যেমন "/path/to/plugin")
    installed_title: "ইনস্টল করা প্লাগইন:\n\n"
    none_installed: |-
      কোনো প্লাগইন ইনস্টল করা নেই।

      প্লাগইন ইনস্টল করুন:
        /plugin install <name-or-url>
    none_found: "কোনো প্লাগইন পাওয়া যায়নি। ভিন্ন অনুসন্ধান চেষ্টা করুন।"
