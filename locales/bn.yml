  credentials:
    title: "সংরক্ষিত ক্রেডেনশিয়াল:\n\n"
    none: "  কোনো ক্রেডেনশিয়াল সংরক্ষিত নেই।\n"
    usage: |

      ব্যবহার:
        /credentials list              - সংরক্ষিত ক্রেডেনশিয়াল দেখান
        /credentials store <svc> <val> - একটি ক্রেডেনশিয়াল সংরক্ষণ করুন
        /credentials get <service>     - একটি ক্রেডেনশিয়াল পুনরুদ্ধার করুন (মাস্ককৃত)
        /credentials delete <service>  - একটি ক্রেডেনশিয়াল মুছুন
        /credentials count             - সংরক্ষিত ক্রেডেনশিয়ালের সংখ্যা দেখান
  session:
    snapshots_title: "সংরক্ষিত সেশন স্ন্যাপশট:\n\n"
    none_saved: |-
      কোনো সংরক্ষিত সেশন স্ন্যাপশট নেই।
      তৈরি করতে `/session save <name>` ব্যবহার করুন।
    load_hint: "\nস্ন্যাপশট পুনরুদ্ধার করতে `/session load <name>` ব্যবহার করুন।"
  debug:
    help: |
      ডেভেলপার ডিবাগ কমান্ড:

        /debug log [level]     - লগ স্তর নির্ধারণ করুন (trace|debug|info|warn|error)
        /debug profile start   - পারফরম্যান্স প্রোফাইলিং শুরু করুন
        /debug profile stop    - প্রোফাইলিং বন্ধ করে ফলাফল দেখান
        /debug trace [on|off]  - এক্সিকিউশন ট্রেসিং টগল করুন
        /debug info            - সিস্টেম ডায়াগনস্টিকস দেখান

      লগ স্তর:
        trace - অভ্যন্তরীণ সহ সব বার্তা
        debug - ডিবাগ বার্তা ও তদূর্ধ্ব
        info  - তথ্যমূলক বার্তা (ডিফল্ট)
        warn  - শুধু সতর্কতা ও ত্রুটি
        error - শুধু গুরুতর ত্রুটি
    system_info_title: "সিস্টেম ডায়াগনস্টিকস:\n\n"
  preset:
    available_title: "উপলব্ধ প্রিসেট:\n\n"
    no_description: "বর্ণনা নেই"
    usage: |

      ব্যবহার:
        /preset              - সব প্রিসেট তালিকাভুক্ত করুন
        /preset <name>       - একটি প্রিসেট প্রয়োগ করুন
        /preset show <name>  - প্রিসেটের বিবরণ দেখান

