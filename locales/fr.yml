    title: "Effacer la conversation"
    confirm: "Effacer tous les messages ? Cette action est irréversible."
  quit:
    title: "Terminer la session ?"
    confirm: "Vous avez une activité non enregistrée. Quitter quand même ?"
  model:
    title: "Définir le modèle"
    prompt: "Entrez le nom du modèle (par ex. claude-3.5-sonnet, gpt-4o)..."
    set: "Modèle défini sur : %{name}"
    context_unknown: "inconnu (selon le fournisseur)"
    cost_unknown: "estimation indisponible"
    cost_free_local: "gratuit (local)"
  remote:
    dashboard_title: "Cibles distantes — l'exécution des outils suit la cible active."
    none: "Aucune cible pour l'instant. Ajoutez-en une avec `/remote add ssh <user@host> <nom> <repertoire>`."
    usage: "Usage : /remote use <nom> | test <nom> | disconnect | reconnect | remove <nom> [--yes] | add ssh <user@host> <nom> <repertoire> | add docker <conteneur> <nom> <repertoire>"
    hint_ssh: "Les hôtes SSH candidats sont découverts depuis ~/.ssh/config."
    connected: "✓ Connecté à %{name} (%{platform}, %{latency}ms). Les appels d'outils s'exécutent désormais sur la cible distante."
    disconnected: "✓ Retour sur la machine locale."
    reconnected: "✓ Reconnecté à %{name}."
    reconnect_failed: "Échec de la reconnexion : %{error}"
    not_connected: "Aucune cible distante active."
    not_found: "Cible inconnue '%{name}'. Voir /remote list."
    remove_confirm: "Supprimer la cible '%{name}' ? Confirmez avec `/remote remove %{name} --yes`."
    remove_done: "✓ Cible '%{name}' supprimée."
    test_ok: "✓ %{name} : %{platform}, %{latency}ms, bash=%{bash}, workspace=%{ws}"
    test_failed: "✗ %{name} : %{error}"
    added: "✓ Cible %{kind} '%{name}' enregistrée. Connectez-vous avec `/remote use %{name}`."
    bash_missing: "⚠ bash introuvable sur la cible — l'outil Bash requiert bash."
    already_connected: "Déjà connecté à %{name}."
  goal:
    set: "◎ Objectif défini (max %{max} itérations) : %{objective}\nEnvoyez un message pour commencer — Shannon continue de travailler entre les tours jusqu'à atteindre l'objectif. /goal pause pour suspendre, /goal clear pour supprimer."
    current: "Objectif (%{status}, itération %{iterations}/%{max}) : %{objective}"
    current_none: "Aucun objectif. Usage : /goal <objectif> | /goal pause | /goal resume | /goal clear"
    cleared: "✓ Objectif supprimé."
    paused_no_progress: "⏸ Objectif suspendu — aucun progrès détecté : %{reason}\nStrikes : %{strikes}/%{max_strikes}. Inspectez puis /goal resume ou /goal clear."
    paused_blocked: "⏸ Objectif suspendu — l'agent signale un blocage : %{reason}\nRésolvez-le puis /goal resume, ou /goal clear pour supprimer."
    paused_budget: "⏸ Objectif suspendu — plafond budgétaire atteint : %{reason}\nAugmentez-le avec /goal <obj> --budget $N, ou /goal clear."
    paused_max: "⏸ Objectif suspendu après %{max} itérations sans achèvement. Évaluez puis /goal resume ou /goal clear."
    resumed: "▶ Objectif repris (compteur d'itérations réinitialisé)."
    complete: "✓ Objectif atteint après %{iterations} itération(s) : %{objective}"
    conflict_loop: "Un /ralph ou /loop est actif — arrêtez-le d'abord, puis définissez /goal."
  connect:
    success: "✓ Connecté à %{provider}"
    choose_model: "Choisissez un modèle ci-dessous (Entrée = par défaut, ↑↓ = sélectionner, Échap = utiliser le modèle par défaut)."
    refresh_started: "Actualisation du catalogue de modèles en arrière-plan…"
    refresh_success: "Catalogue actualisé — %{count} modèles disponibles."
    refresh_failed: "Hors ligne — utilisation du catalogue en cache."
    dashboard_header: "Connectez un fournisseur — aucune variable d'environnement requise."
    dashboard_providers: "Fournisseurs :"
    dashboard_usage: "Utilisation : /connect <fournisseur> <clé-api>"
    dashboard_help: "détail : /help connect"
    key_stored: "✓ Clé API stockée pour '%{provider}' (service : %{service})"
    config_saved: "✓ Configuration du fournisseur enregistrée : %{path}"
    reusing_key: "• Réutilisation de la clé stockée pour '%{provider}' (service : %{service})"
    cred_verified: "✓ Identifiants vérifiés — '%{model}' est accessible avec cette clé."
    auth_failed: "✗ Échec de l'authentification pour '%{provider}'. La clé a été stockée mais le fournisseur l'a rejetée — vérifiez la clé et relancez /connect."
    verify_warning: "⚠ Impossible de vérifier complètement les identifiants de '%{provider}' (%{error}). La clé est stockée ; elle pourrait quand même fonctionner — essayez d'envoyer un message."
    probe_failed: "⚠ Échec du test des identifiants pour '%{provider}'. La clé est stockée ; elle pourrait quand même fonctionner."
    switched: "✓ Passage à %{provider} — modèle : %{model} (nouveaux identifiants actifs ; aucun redémarrage nécessaire)"
    storing_error: "stockage des identifiants : %{error}"
    saving_error: "enregistrement de providers.toml : %{error}"
  provider:
    available: "Fournisseurs disponibles :"
    legend: "* = actuel | Utilisez /provider <nom> pour changer"
    switched: "Fournisseur : %{provider} | Modèle : %{model}"
    switched_no_catalog: "Fournisseur défini sur %{provider}. Il n'a pas de liste de modèles intégrée — utilisez `/model <provider>/<model-id>` pour choisir un modèle."
    no_selection: "Aucun fournisseur sélectionné. Exécutez d'abord /connect <fournisseur> <clé>."
  disconnect:
    usage: "Utilisation : /disconnect <fournisseur>\nSupprime la connexion enregistrée d'un fournisseur (son entrée dans providers.toml) afin qu'il ne soit plus connecté. Votre clé API stockée est conservée — relancez /connect pour vous reconnecter."
    not_connected: "'%{provider}' n'était pas connecté. Utilisez /connect pour le connecter."
    done: "✓ '%{provider}' déconnecté."
    switched: "Fournisseur actif changé en %{provider} (modèle : %{model})."
    none_remain: "Aucun fournisseur connecté restant — exécutez /connect <fournisseur> <clé> pour vous reconnecter."
  config:
    warning_load: "Avertissement : impossible de charger la configuration : %{error}"
    key_not_found: "Clé de configuration introuvable : %{key}"
    error_saving: "Erreur lors de l'enregistrement de la configuration : %{error}"
    usage_get: "Utilisation : /config get <clé>"
    usage_set: "Utilisation : /config set <clé> <valeur>"
    usage_reset: "Utilisation : /config reset <clé>"
    settings_title: "Paramètres de configuration :\n\n"
    usage: |

      Utilisation :
        /config list          - Afficher tous les paramètres
        /config get <clé>     - Obtenir une valeur spécifique
        /config set <clé> <valeur> - Définir une valeur
        /config reset <clé>   - Réinitialiser à la valeur par défaut
  hooks:
    none: "Aucun hook configuré."
    reloaded: "Hooks rechargés avec succès."
    reload_failed: "Échec du rechargement des hooks : %{error}"
  memory:
    usage_remember: "Utilisation : /remember <texte à mémoriser>"
