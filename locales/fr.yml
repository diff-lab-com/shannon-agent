    session_exported: "Session exportée vers : %{path}"
    export_failed: "Échec de l'exportation : %{error}"
    export_error: "Erreur d'exportation : %{error}"
    no_sessions: "Aucune session enregistrée trouvée."
  resume:
    usage: "Utilisation : /resume <numéro-ou-uuid>\nUtilisez /sessions pour voir les sessions disponibles."
    invalid_number: "Numéro de session invalide : %{num}. Utilisez /sessions pour voir les sessions disponibles."
    invalid_id: "Identifiant de session invalide : %{arg}. Utilisez un numéro de /sessions ou un UUID."
    not_found: "Session introuvable : %{id}"
    load_error: "Erreur lors du chargement de la session : %{error}"
    warn_restore: "Avertissement : impossible de restaurer le contexte AI (les messages n'auront pas d'historique antérieur) : %{error}"
  history:
    usage: "Utilisation : /history --export <chemin-du-fichier>"
  rewind:
    usage: "Utilisation : /rewind [nombre-de-tours]"
  image:
    file_not_found: "Fichier introuvable : %{path}"
    read_failed: "Échec de la lecture du fichier : %{error}"
    image_attached: "[Image jointe : %{path}]"
    image_sent: "Image envoyée au modèle. Traitement en cours..."
    clipboard_pasted: "[Image collée depuis le presse-papiers]"
    clipboard_sent: "Image du presse-papiers envoyée. Traitement en cours..."
    no_engine: "Le moteur de requêtes n'est pas disponible."
  notify:
    enabled: "Notifications de bureau activées."
    disabled: "Notifications de bureau désactivées."
  sandbox:
    enabled: "Mode bac à sable activé (isolation Docker)."
    disabled: "Mode bac à sable désactivé (exécution directe)."
    not_available: "Docker n'est pas disponible. Le mode bac à sable nécessite Docker."
  team:
    help: |-
      /team create <name> [description]  — Créer une nouvelle équipe d'agents
      /team add <team> <agent-name>  — Ajouter un agent à l'équipe
      /team task <team> <subject>  — Ajouter une tâche
      /team assign <team>  — Attribuer les tâches en attente aux agents disponibles
      /team status [team]  — Afficher l'état de l'équipe
      /team list  — Lister toutes les équipes
      /team run  — Exécuter les tâches en attente en parallèle
      /team shutdown  — Arrêter l'équipe
      /team disband <team>  — Dissoudre l'équipe et nettoyer
      /team delegate  — Basculer le mode délégation (seul le leader coordonne)
  plugin:
    help: |
      Gestion des plugins :

        /plugin list                    - Lister les plugins installés
        /plugin search <query>          - Rechercher dans le registre de plugins
        /plugin info <name>             - Afficher les détails du plugin depuis l'index
        /plugin install <name-or-url>   - Installer un plugin
        /plugin uninstall <name>        - Supprimer un plugin
        /plugin update [name]           - Mettre à jour les plugins
        /plugin enable <name>           - Activer un plugin
        /plugin disable <name>          - Désactiver un plugin

      Sources de plugins :
        - Nom du registre (par ex. "example-plugin")
        - URL Git (par ex. "https://github.com/user/plugin")
        - Chemin local (par ex. "/path/to/plugin")
    installed_title: "Plugins installés :\n\n"
    none_installed: |-
      Aucun plugin installé.

      Installez des plugins avec :
        /plugin install <name-or-url>
    none_found: "Aucun plugin trouvé. Essayez une autre recherche."
    search_results_title: "Résultats de la recherche :\n\n"
    search_results_ranked_title: "Résultats de la recherche (classés par pertinence) :\n\n"
  doctor:
    title: "Diagnostics de Shannon Code\n"
    results_summary: "Résultats : %{passed} réussis, %{warnings} avertissements, %{failed} échoués\n"
  credentials:
    title: "Identifiants stockés :\n\n"
    none: "  Aucun identifiant stocké.\n"
    usage: |

      Utilisation :
        /credentials list              - Afficher les identifiants stockés
        /credentials store <svc> <val> - Stocker un identifiant
        /credentials get <service>     - Récupérer un identifiant (masqué)
        /credentials delete <service>  - Supprimer un identifiant
        /credentials count             - Afficher le nombre d'identifiants stockés
  session:
    snapshots_title: "Instantanés de session enregistrés :\n\n"
    none_saved: |-
      Aucun instantané de session enregistré.
      Utilisez `/session save <nom>` pour en créer un.
    load_hint: "\nUtilisez `/session load <nom>` pour restaurer un instantané."
  debug:
    help: |
      Commandes de débogage pour développeurs :

        /debug log [level]     - Définir le niveau de journal (trace|debug|info|warn|error)
        /debug profile start   - Démarrer le profilage de performance
        /debug profile stop    - Arrêter le profilage et afficher les résultats
        /debug trace [on|off]  - Basculer le traçage d'exécution
        /debug info            - Afficher les diagnostics système

      Niveaux de journal :
        trace - Tous les messages, y compris internes
        debug - Messages de débogage et au-delà
        info  - Messages d'information (défaut)
        warn  - Avertissements et erreurs uniquement
        error - Erreurs critiques uniquement
    system_info_title: "Diagnostics système :\n\n"
  preset:
    available_title: "Préréglages disponibles :\n\n"
    no_description: "Aucune description"
    usage: |

      Utilisation :
        /preset              - Lister tous les préréglages
        /preset <nom>       - Appliquer un préréglage
        /preset show <nom>  - Afficher les détails d'un préréglage

