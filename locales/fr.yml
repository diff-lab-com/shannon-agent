# ── Status Messages ────────────────────────────────────────────────────────
status:
  ready: "Prêt"
  processing: "Traitement en cours..."
  running: "En cours d'exécution"
  error: "Erreur : %{error}"
  warning: "Avertissement : %{message}"
  loading: "Chargement..."
  completed: "Terminé"
  failed: "Échoué"
  cancelled_status: "Annulé"

# ── Command Descriptions ───────────────────────────────────────────────────
commands:
  help:
    title: "Commandes disponibles"
    no_help_found: "Aucune aide trouvée pour : %{topic}"
    footer: "Utilisez `/help <commande>` pour des informations détaillées sur une commande spécifique.\n"
