    remembered: "Mémorisé (id : %{id}...)"
    no_memories: "Aucune mémoire trouvée."
    usage_forget: "Utilisation : /forget <préfixe-id-mémoire>"
    forgot: "Mémoire oubliée %{id}..."
    not_found: "Mémoire introuvable."
    delete_error: "Erreur lors de la suppression de la mémoire : %{error}"
    no_match: "Aucune mémoire trouvée correspondant à '%{prefix}'"
    cleanup: "Nettoyage terminé : %{removed} mémoires obsolètes supprimées. %{remaining} restantes."
