  no_input: "Aucune entrée fournie sur stdin."
  input_error: "Erreur d'entrée : %{error}"
  query_failed: "Échec de la requête : %{error}"
  stream_error: "Erreur de flux : %{error}"
  cancelled: "Annulé"
