# ── Command Descriptions ───────────────────────────────────────────────────
commands:
  help:
    title: "Available Commands"
    no_help_found: "No help found for: %{topic}"
    footer: "Use `/help <command>` for detailed information about a specific command.\n"
  clear:
    title: "Clear Chat"
    confirm: "Clear all messages? This cannot be undone."
  quit:
    title: "End Session?"
    confirm: "You have unsaved activity. Quit anyway?"
  model:
    title: "Set Model"
    prompt: "Enter model name (e.g. claude-3.5-sonnet, gpt-4o)..."
    set: "Model set to: %{name}"
    context_unknown: "unknown (per provider)"
    cost_unknown: "estimate unavailable"
    cost_free_local: "free (local)"
  remote:
    dashboard_title: "Remote targets — tool execution follows the active target."
    none: "No targets yet. Add one with `/remote add ssh <user@host> <name> <workspace_dir>`."
    usage: "Usage: /remote use <name> | test <name> | disconnect | reconnect | remove <name> [--yes] | add ssh <user@host> <name> <workspace_dir> | add docker <container> <name> <workspace_dir>"
    hint_ssh: "SSH candidates are discovered from ~/.ssh/config."
    connected: "✓ Connected to %{name} (%{platform}, %{latency}ms). Tool calls now run on the remote target."
    disconnected: "✓ Back on the local machine."
    reconnected: "✓ Reconnected to %{name}."
    reconnect_failed: "Reconnect failed: %{error}"
    not_connected: "No remote target is active."
    not_found: "Unknown target '%{name}'. See /remote list."
    remove_confirm: "Remove target '%{name}'? Confirm with `/remote remove %{name} --yes`."
    remove_done: "✓ Removed target '%{name}'."
    test_ok: "✓ %{name}: %{platform}, %{latency}ms, bash=%{bash}, workspace=%{ws}"
    test_failed: "✗ %{name}: %{error}"
    added: "✓ Saved %{kind} target '%{name}'. Connect with `/remote use %{name}`."
    bash_missing: "⚠ bash was not found on the target — the Bash tool requires bash."
    already_connected: "Already connected to %{name}."
  goal:
    set: "◎ Goal set (max %{max} iterations): %{objective}\nSend a message to begin — Shannon keeps working across turns until the goal is met. /goal pause to pause, /goal clear to remove."
    current: "Goal (%{status}, iteration %{iterations}/%{max}): %{objective}"
    current_none: "No goal set. Usage: /goal <objective> | /goal pause | /goal resume | /goal clear"
    cleared: "✓ Goal cleared."
    paused_no_progress: "⏸ Goal paused — no progress detected: %{reason}\nCurrent strikes: %{strikes}/%{max_strikes}. Inspect, then /goal resume (re-arms the budget) or /goal clear."
    paused_blocked: "⏸ Goal paused — agent reports a blocker: %{reason}\nResolve it and run /goal resume, or /goal clear to remove."
    paused_budget: "⏸ Goal paused — budget cap reached: %{reason}\nRaise the cap with /goal <obj> --budget $N, or /goal clear."
    paused_max: "⏸ Goal paused after %{max} iteration(s) without completion. Assess progress, then /goal resume or /goal clear."
    resumed: "▶ Goal resumed (iteration budget reset)."
    complete: "✓ Goal complete after %{iterations} iteration(s): %{objective}"
    conflict_loop: "A /ralph or /loop is active — stop it first (they own auto-continuation), then set /goal."
  connect:
    success: "✓ Connected to %{provider}"
    choose_model: "Pick a model below (Enter = default, ↑↓ = select, Esc = use default)."
    refresh_started: "Refreshing model catalog in the background…"
    refresh_success: "Catalog refreshed — %{count} models available."
    refresh_failed: "Offline — using cached catalog."
    dashboard_header: "Connect a provider — no env var needed."
    dashboard_providers: "Providers:"
    dashboard_usage: "Usage: /connect <provider> <api-key>"
    dashboard_help: "detail: /help connect"
    key_stored: "✓ API key stored for '%{provider}' (service: %{service})"
    config_saved: "✓ Provider config saved: %{path}"
    reusing_key: "• Reusing stored key for '%{provider}' (service: %{service})"
    cred_verified: "✓ Credential verified — '%{model}' is reachable with this key."
    auth_failed: "✗ Authentication failed for '%{provider}'. The key was stored but the provider rejected it — check the key and run /connect again."
    verify_warning: "⚠ Could not fully verify the credential for '%{provider}' (%{error}). The key is stored; it may still work — try sending a message."
    probe_failed: "⚠ Credential probe failed for '%{provider}'. The key is stored; it may still work."
    switched: "✓ Switched to %{provider} — model: %{model} (new credential active; no restart needed)"
    storing_error: "storing credential: %{error}"
    saving_error: "saving providers.toml: %{error}"
  provider:
    available: "Available providers:"
    legend: "* = current | Use /provider <name> to switch"
    switched: "Provider: %{provider} | Model: %{model}"
    switched_no_catalog: "Provider set to %{provider}. It has no built-in model list — use `/model <provider>/<model-id>` to choose a model."
    foreign_model_warning: "⚠ Note: current model %{model} belongs to %{old_provider}; the switch keeps it, so requests would go to %{new_provider}. To pick a model explicitly: /model %{new_provider}/<model-id>"
    no_selection: "No provider selected. Run /connect <provider> <key> first."
    health_skipped_header: "Skipped (no probeable list-models endpoint):"
    health_skipped_line: "· %{provider} — skipped: no list-models endpoint to probe"
  disconnect:
    usage: "Usage: /disconnect <provider>\nRemoves a provider's saved connection (its providers.toml entry) so it is no longer connected. Your stored API key is kept — re-run /connect to reconnect."
    not_connected: "'%{provider}' was not connected. Use /connect to connect it."
    done: "✓ Disconnected '%{provider}'."
    switched: "Switched active provider to %{provider} (model: %{model})."
    none_remain: "No connected providers remain — run /connect <provider> <key> to reconnect."
  config:
    warning_load: "Warning: could not load config: %{error}"
    key_not_found: "Config key not found: %{key}"
    error_saving: "Error saving config: %{error}"
    usage_get: "Usage: /config get <key>"
    usage_set: "Usage: /config set <key> <value>"
    usage_reset: "Usage: /config reset <key>"
    refused_secret: "Refused: '%{key}' is not a writable config.toml key — secrets belong in /credentials, not config files (A1)"
    settings_title: "Configuration Settings:\n\n"
    usage: |

      Usage:
        /config list          - Show all settings
        /config get <key>     - Get a specific value
        /config set <key> <value> - Set a value
        /config reset <key>   - Reset to default
  hooks:
    none: "No hooks configured."
    reloaded: "Hooks reloaded successfully."
    reload_failed: "Failed to reload hooks: %{error}"
  memory:
    usage_remember: "Usage: /remember <text to remember>"
    store_not_available: "Memory store not available."
    store_not_configured: "Memory store not configured."
    save_failed: "Failed to save memory: %{error}"
    remembered: "Remembered (id: %{id}...)"
    no_memories: "No memories found."
    usage_forget: "Usage: /forget <memory-id-prefix>"
    forgot: "Forgot memory %{id}..."
    not_found: "Memory not found."
    delete_error: "Error deleting memory: %{error}"
    no_match: "No memory found matching '%{prefix}'"
    cleanup: "Cleanup complete: removed %{removed} stale memories. %{remaining} remaining."
  export:
    session_exported: "Session exported to: %{path}"
    export_failed: "Failed to export: %{error}"
    export_error: "Export error: %{error}"
    no_sessions: "No saved sessions found."
  resume:
    usage: "Usage: /resume <number-or-uuid>\nUse /sessions to see available sessions."
    invalid_number: "Invalid session number: %{num}. Use /sessions to see available sessions."
    invalid_id: "Invalid session identifier: %{arg}. Use a number from /sessions or a UUID."
    not_found: "Session not found: %{id}"
    load_error: "Error loading session: %{error}"
    warn_restore: "Warning: could not restore AI context (messages will lack prior history): %{error}"
  history:
    usage: "Usage: /history --export <file-path>"
  rewind:
    usage: "Usage: /rewind [number-of-turns]"
  image:
    file_not_found: "File not found: %{path}"
    read_failed: "Failed to read file: %{error}"
    image_attached: "[Image attached: %{path}]"
    image_sent: "Image sent to model. Processing..."
    clipboard_pasted: "[Image pasted from clipboard]"
    clipboard_sent: "Clipboard image sent. Processing..."
    no_engine: "Query engine not available."
  notify:
    enabled: "Desktop notifications enabled."
    disabled: "Desktop notifications disabled."
  sandbox:
    enabled: "Sandbox mode enabled (Docker isolation)."
    disabled: "Sandbox mode disabled (direct execution)."
    not_available: "Docker is not available. Sandbox mode requires Docker."
  team:
    help: |-
      /team create <name> [description]  — Create a new agent team
      /team add <team> <agent-name>  — Add agent to team
      /team task <team> <subject>  — Add a task
      /team assign <team>  — Assign pending tasks to available agents
      /team status [team]  — Show team status
      /team list  — List all teams
      /team run  — Execute pending tasks in parallel
      /team shutdown  — Shutdown team
      /team disband <team>  — Disband team and clean up
      /team delegate  — Toggle delegate mode (lead only coordinates)
  plugin:
    help: |
      Plugin Management:

        /plugin list                    - List installed plugins
        /plugin search <query>          - Search plugin registry
        /plugin info <name>             - Show plugin details from index
        /plugin install <name-or-url>   - Install a plugin
        /plugin uninstall <name>        - Remove a plugin
        /plugin update [name]           - Update plugins
        /plugin enable <name>           - Enable a plugin
        /plugin disable <name>          - Disable a plugin

      Plugin Sources:
        - Registry name (e.g., "example-plugin")
        - Git URL (e.g., "https://github.com/user/plugin")
        - Local path (e.g., "/path/to/plugin")
    installed_title: "Installed Plugins:\n\n"
    none_installed: |-
      No plugins installed.

      Install plugins with:
        /plugin install <name-or-url>
    none_found: "No plugins found. Try a different search query."
    search_results_title: "Search Results:\n\n"
    search_results_ranked_title: "Search Results (ranked by relevance):\n\n"
  doctor:
    title: "Shannon Code Diagnostics\n"
    results_summary: "Results: %{passed} passed, %{warnings} warnings, %{failed} failed\n"
  credentials:
    title: "Stored Credentials:\n\n"
    none: "  No credentials stored.\n"
    usage: |

      Usage:
        /credentials list              - Show stored credentials
        /credentials store <svc> <val> - Store a credential
        /credentials get <service>     - Retrieve a credential (masked)
        /credentials delete <service>  - Delete a credential
        /credentials count             - Show stored credential count
  session:
    snapshots_title: "Saved session snapshots:\n\n"
    none_saved: |-
      No saved session snapshots.
      Use `/session save <name>` to create one.
    load_hint: "\nUse `/session load <name>` to restore a snapshot."
  debug:
    help: |
      Developer Debug Commands:

        /debug log [level]     - Set log level (trace|debug|info|warn|error)
        /debug profile start   - Start performance profiling
        /debug profile stop    - Stop profiling and show results
        /debug trace [on|off]  - Toggle execution tracing
        /debug info            - Show system diagnostics

      Log Levels:
        trace - All messages including internals
        debug - Debug messages and above
        info  - Informational messages (default)
        warn  - Warnings and errors only
        error - Critical errors only
    system_info_title: "System Diagnostics:\n\n"
  preset:
    available_title: "Available Presets:\n\n"
    no_description: "No description"
    usage: |

      Usage:
        /preset              - List all presets
        /preset <name>       - Apply a preset
        /preset show <name>  - Show preset details
  profile:
    migration_hint: "Note: /profile is being renamed — permission profiles now live at /permissions. In a future release /profile will switch to provider profiles (/profiles)."

