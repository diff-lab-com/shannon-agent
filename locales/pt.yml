    refresh_success: "Catálogo atualizado — %{count} modelos disponíveis."
    refresh_failed: "Offline — usando o catálogo em cache."
    dashboard_header: "Conecte um provedor — sem necessidade de variável de ambiente."
    dashboard_providers: "Provedores:"
    dashboard_usage: "Uso: /connect <provedor> <chave-api>"
    dashboard_help: "detalhes: /help connect"
    key_stored: "✓ Chave de API armazenada para '%{provider}' (serviço: %{service})"
    config_saved: "✓ Configuração do provedor salva: %{path}"
    reusing_key: "• Reutilizando a chave armazenada de '%{provider}' (serviço: %{service})"
    cred_verified: "✓ Credencial verificada — '%{model}' está acessível com esta chave."
    auth_failed: "✗ Falha na autenticação para '%{provider}'. A chave foi armazenada, mas o provedor a rejeitou — verifique a chave e execute /connect novamente."
