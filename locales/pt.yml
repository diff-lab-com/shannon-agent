  notify:
    enabled: "Notificações de desktop ativadas."
    disabled: "Notificações de desktop desativadas."
  sandbox:
    enabled: "Modo sandbox ativado (isolamento via Docker)."
    disabled: "Modo sandbox desativado (execução direta)."
    not_available: "Docker não está disponível. O modo sandbox requer Docker."
  team:
    help: |-
      /team create <name> [description]  — Criar um novo time de agentes
      /team add <team> <agent-name>  — Adicionar agente ao time
      /team task <team> <subject>  — Adicionar uma tarefa
      /team assign <team>  — Atribuir tarefas pendentes aos agentes disponíveis
      /team status [team]  — Mostrar status do time
      /team list  — Listar todos os times
      /team run  — Executar tarefas pendentes em paralelo
      /team shutdown  — Encerrar o time
      /team disband <team>  — Dissolver o time e fazer a limpeza
      /team delegate  — Alternar modo delegação (apenas o líder coordena)
  plugin:
    help: |
      Gerenciamento de plugins:

        /plugin list                    - Listar plugins instalados
        /plugin search <query>          - Buscar no registro de plugins
        /plugin info <name>             - Mostrar detalhes do plugin do índice
        /plugin install <name-or-url>   - Instalar um plugin
        /plugin uninstall <name>        - Remover um plugin
        /plugin update [name]           - Atualizar plugins
        /plugin enable <name>           - Ativar um plugin
        /plugin disable <name>          - Desativar um plugin

      Fontes de plugins:
        - Nome no registro (ex: "example-plugin")
        - URL do Git (ex: "https://github.com/user/plugin")
        - Caminho local (ex: "/path/to/plugin")
    installed_title: "Plugins instalados:\n\n"
    none_installed: |-
      Nenhum plugin instalado.

      Instale plugins com:
        /plugin install <name-or-url>
    none_found: "Nenhum plugin encontrado. Tente uma busca diferente."
    search_results_title: "Resultados da busca:\n\n"
    search_results_ranked_title: "Resultados da busca (classificados por relevância):\n\n"
  doctor:
    title: "Diagnósticos do Shannon Code\n"
    results_summary: "Resultados: %{passed} bem-sucedidos, %{warnings} avisos, %{failed} com falha\n"
  credentials:
    title: "Credenciais armazenadas:\n\n"
    none: "  Nenhuma credencial armazenada.\n"
    usage: |

      Uso:
        /credentials list              - Mostrar credenciais armazenadas
        /credentials store <svc> <val> - Armazenar uma credencial
        /credentials get <service>     - Recuperar uma credencial (mascarada)
        /credentials delete <service>  - Excluir uma credencial
        /credentials count             - Mostrar quantidade de credenciais armazenadas
  session:
    snapshots_title: "Snapshots de sessão salvos:\n\n"
    none_saved: |-
      Nenhum snapshot de sessão salvo.
      Use `/session save <nome>` para criar um.
    load_hint: "\nUse `/session load <nome>` para restaurar um snapshot."
  debug:
    help: |
      Comandos de depuração para desenvolvedores:

        /debug log [level]     - Definir nível de log (trace|debug|info|warn|error)
        /debug profile start   - Iniciar profiling de desempenho
        /debug profile stop    - Parar o profiling e mostrar resultados
        /debug trace [on|off]  - Alternar rastreamento de execução
        /debug info            - Mostrar diagnósticos do sistema

      Níveis de log:
        trace - Todas as mensagens, incluindo internas
        debug - Mensagens de depuração e acima
        info  - Mensagens informativas (padrão)
        warn  - Apenas avisos e erros
        error - Apenas erros críticos
    system_info_title: "Diagnósticos do sistema:\n\n"
  preset:
    available_title: "Presets disponíveis:\n\n"
    no_description: "Sem descrição"
    usage: |

      Uso:
        /preset              - Listar todos os presets
        /preset <nome>       - Aplicar um preset
        /preset show <nome>  - Mostrar detalhes do preset

