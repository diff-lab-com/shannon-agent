    hint_ssh: "Hosts SSH candidatos são descobertos de ~/.ssh/config."
    connected: "✓ Conectado a %{name} (%{platform}, %{latency}ms). As chamadas de ferramentas agora rodam no alvo remoto."
    disconnected: "✓ De volta à máquina local."
    reconnected: "✓ Reconectado a %{name}."
    reconnect_failed: "Falha ao reconectar: %{error}"
