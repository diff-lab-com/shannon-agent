    enabled: "Режим песочницы включён (изоляция Docker)."
    disabled: "Режим песочницы отключён (прямое выполнение)."
    not_available: "Docker недоступен. Режим песочницы требует Docker."
  team:
    help: |-
      /team create <name> [description]  — Создать новую команду агентов
      /team add <team> <agent-name>  — Добавить агента в команду
      /team task <team> <subject>  — Добавить задачу
      /team assign <team>  — Распределить ожидающие задачи между свободными агентами
      /team status [team]  — Показать статус команды
      /team list  — Список всех команд
      /team run  — Выполнить ожидающие задачи параллельно
      /team shutdown  — Остановить команду
      /team disband <team>  — Расформировать команду и выполнить очистку
      /team delegate  — Переключить режим делегирования (координирует только лид)
  plugin:
    help: |
      Управление плагинами:

        /plugin list                    - Список установленных плагинов
        /plugin search <query>          - Поиск в реестре плагинов
        /plugin info <name>             - Показать сведения о плагине из индекса
        /plugin install <name-or-url>   - Установить плагин
        /plugin uninstall <name>        - Удалить плагин
        /plugin update [name]           - Обновить плагины
        /plugin enable <name>           - Включить плагин
        /plugin disable <name>          - Отключить плагин

      Источники плагинов:
        - Имя в реестре (например, "example-plugin")
        - Git URL (например, "https://github.com/user/plugin")
        - Локальный путь (например, "/path/to/plugin")
    installed_title: "Установленные плагины:\n\n"
    none_installed: |-
      Плагины не установлены.

      Установите плагины командой:
        /plugin install <name-or-url>
    none_found: "Плагины не найдены. Попробуйте изменить поисковый запрос."
    search_results_title: "Результаты поиска:\n\n"
    search_results_ranked_title: "Результаты поиска (отсортированы по релевантности):\n\n"
  doctor:
    title: "Диагностика Shannon Code\n"
    results_summary: "Результаты: %{passed} успешно, %{warnings} предупреждений, %{failed} с ошибками\n"
  credentials:
    title: "Сохранённые учётные данные:\n\n"
    none: "  Учётные данные не сохранены.\n"
    usage: |

      Использование:
        /credentials list              - Показать сохранённые учётные данные
        /credentials store <svc> <val> - Сохранить учётные данные
        /credentials get <service>     - Получить учётные данные (скрытые маской)
        /credentials delete <service>  - Удалить учётные данные
        /credentials count             - Показать количество сохранённых учётных данных
  session:
    snapshots_title: "Сохранённые снимки сеанса:\n\n"
    none_saved: |-
      Сохранённых снимков сеанса нет.
      Создайте их командой `/session save <имя>`.
    load_hint: "\nИспользуйте `/session load <имя>`, чтобы восстановить снимок."
  debug:
    help: |
      Команды отладки для разработчиков:

        /debug log [level]     - Установить уровень журнала (trace|debug|info|warn|error)
        /debug profile start   - Запустить профилирование производительности
        /debug profile stop    - Остановить профилирование и показать результаты
        /debug trace [on|off]  - Переключить трассировку выполнения
        /debug info            - Показать диагностику системы

      Уровни журнала:
        trace - Все сообщения, включая внутренние
        debug - Отладочные сообщения и выше
        info  - Информационные сообщения (по умолчанию)
        warn  - Только предупреждения и ошибки
        error - Только критические ошибки
    system_info_title: "Диагностика системы:\n\n"
  preset:
    available_title: "Доступные пресеты:\n\n"
    no_description: "Нет описания"
    usage: |

      Использование:
        /preset              - Список всех пресетов
        /preset <имя>       - Применить пресет
        /preset show <имя>  - Показать детали пресета

