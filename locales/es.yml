  welcome_help: "Escribe tu mensaje y presiona **Enter**. Escribe `/help` para ver los comandos."
  no_input: "No se proporcionó entrada en stdin."
  input_error: "Error de entrada: %{error}"
  query_failed: "Consulta fallida: %{error}"
