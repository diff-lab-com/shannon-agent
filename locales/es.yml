    none: "No hay hooks configurados."
    reloaded: "Hooks recargados exitosamente."
    reload_failed: "Error al recargar hooks: %{error}"
  memory:
    usage_remember: "Uso: /remember <texto a recordar>"
    store_not_available: "Almacén de memoria no disponible."
    store_not_configured: "Almacén de memoria no configurado."
    save_failed: "Error al guardar memoria: %{error}"
    remembered: "Recordado (id: %{id}...)"
    no_memories: "No se encontraron memorias."
    usage_forget: "Uso: /forget <prefijo-id-memoria>"
    forgot: "Memoria olvidada %{id}..."
    not_found: "Memoria no encontrada."
    delete_error: "Error al eliminar memoria: %{error}"
    no_match: "No se encontró memoria que coincida con '%{prefix}'"
    cleanup: "Limpieza completa: se eliminaron %{removed} memorias obsoletas. Quedan %{remaining}."
  export:
    session_exported: "Sesión exportada a: %{path}"
    export_failed: "Error al exportar: %{error}"
    export_error: "Error de exportación: %{error}"
    no_sessions: "No se encontraron sesiones guardadas."
  resume:
    usage: "Uso: /resume <número-o-uuid>\nUsa /sessions para ver las sesiones disponibles."
    invalid_number: "Número de sesión inválido: %{num}. Usa /sessions para ver las sesiones disponibles."
    invalid_id: "Identificador de sesión inválido: %{arg}. Usa un número de /sessions o un UUID."
    not_found: "Sesión no encontrada: %{id}"
    load_error: "Error al cargar sesión: %{error}"
    warn_restore: "Advertencia: no se pudo restaurar el contexto de IA (los mensajes no tendrán historial previo): %{error}"
  history:
    usage: "Uso: /history --export <ruta-de-archivo>"
  rewind:
    usage: "Uso: /rewind [número-de-turnos]"
  image:
    file_not_found: "Archivo no encontrado: %{path}"
    read_failed: "Error al leer archivo: %{error}"
    image_attached: "[Imagen adjuntada: %{path}]"
    image_sent: "Imagen enviada al modelo. Procesando..."
    clipboard_pasted: "[Imagen pegada del portapapeles]"
    clipboard_sent: "Imagen del portapapeles enviada. Procesando..."
    no_engine: "Motor de consulta no disponible."
  notify:
    enabled: "Notificaciones de escritorio habilitadas."
    disabled: "Notificaciones de escritorio deshabilitadas."
  sandbox:
    enabled: "Modo sandbox habilitado (aislamiento Docker)."
    disabled: "Modo sandbox deshabilitado (ejecución directa)."
    not_available: "Docker no está disponible. El modo sandbox requiere Docker."
  team:
    help: |-
      /team create <name> [description]  — Crear un nuevo equipo de agentes
      /team add <team> <agent-name>  — Añadir un agente al equipo
      /team task <team> <subject>  — Añadir una tarea
      /team assign <team>  — Asignar tareas pendientes a los agentes disponibles
      /team status [team]  — Mostrar el estado del equipo
      /team list  — Listar todos los equipos
      /team run  — Ejecutar tareas pendientes en paralelo
      /team shutdown  — Apagar el equipo
      /team disband <team>  — Disolver el equipo y limpiar
      /team delegate  — Alternar el modo delegación (solo el líder coordina)
  plugin:
    help: |
      Gestión de plugins:

        /plugin list                    - Listar plugins instalados
        /plugin search <query>          - Buscar en el registro de plugins
        /plugin info <name>             - Mostrar detalles del plugin desde el índice
        /plugin install <name-or-url>   - Instalar un plugin
        /plugin uninstall <name>        - Eliminar un plugin
        /plugin update [name]           - Actualizar plugins
        /plugin enable <name>           - Habilitar un plugin
        /plugin disable <name>          - Deshabilitar un plugin

      Fuentes de plugins:
        - Nombre del registro (ej. "example-plugin")
        - URL de Git (ej. "https://github.com/user/plugin")
        - Ruta local (ej. "/path/to/plugin")
    installed_title: "Plugins instalados:\n\n"
    none_installed: |-
      No hay plugins instalados.

      Instala plugins con:
        /plugin install <name-or-url>
    none_found: "No se encontraron plugins. Prueba con otra búsqueda."
    search_results_title: "Resultados de la búsqueda:\n\n"
    search_results_ranked_title: "Resultados de la búsqueda (ordenados por relevancia):\n\n"
  doctor:
    title: "Diagnósticos de Shannon Code\n"
    results_summary: "Resultados: %{passed} correctas, %{warnings} advertencias, %{failed} fallidas\n"
  credentials:
    title: "Credenciales almacenadas:\n\n"
    none: "  No hay credenciales almacenadas.\n"
    usage: |

      Uso:
        /credentials list              - Mostrar credenciales almacenadas
        /credentials store <svc> <val> - Almacenar una credencial
        /credentials get <service>     - Recuperar una credencial (enmascarada)
        /credentials delete <service>  - Eliminar una credencial
        /credentials count             - Mostrar el número de credenciales almacenadas
  session:
    snapshots_title: "Instantáneas de sesión guardadas:\n\n"
    none_saved: |-
      No hay instantáneas de sesión guardadas.
      Usa `/session save <nombre>` para crear una.
    load_hint: "\nUsa `/session load <nombre>` para restaurar una instantánea."
  debug:
    help: |
      Comandos de depuración para desarrolladores:

        /debug log [level]     - Establecer nivel de registro (trace|debug|info|warn|error)
        /debug profile start   - Iniciar perfil de rendimiento
        /debug profile stop    - Detener el perfil y mostrar resultados
        /debug trace [on|off]  - Alternar trazas de ejecución
        /debug info            - Mostrar diagnósticos del sistema

      Niveles de registro:
        trace - Todos los mensajes, incluidos los internos
        debug - Mensajes de depuración y superiores
        info  - Mensajes informativos (predeterminado)
        warn  - Solo advertencias y errores
        error - Solo errores críticos
    system_info_title: "Diagnósticos del sistema:\n\n"
  preset:
    available_title: "Presets disponibles:\n\n"
    no_description: "Sin descripción"
    usage: |

      Uso:
        /preset              - Listar todos los presets
        /preset <nombre>       - Aplicar un preset
        /preset show <nombre>  - Mostrar detalles del preset

