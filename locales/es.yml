# ── Status Messages ────────────────────────────────────────────────────────
status:
  ready: "Listo"
  processing: "Procesando..."
  running: "Ejecutando"
  error: "Error: %{error}"
  warning: "Advertencia: %{message}"
  loading: "Cargando..."
  completed: "Completado"
  failed: "Fallido"
  cancelled_status: "Cancelado"

# ── Command Descriptions ───────────────────────────────────────────────────
commands:
  help:
    title: "Comandos disponibles"
    no_help_found: "No se encontró ayuda para: %{topic}"
    footer: "Usa `/help <comando>` para información detallada sobre un comando específico.\n"
  clear:
    title: "Borrar chat"
    confirm: "Borrar todos los mensajes? Esta acción no se puede deshacer."
  quit:
    title: "Finalizar sesión?"
    confirm: "Tienes actividad sin guardar. Salir de todas formas?"
  model:
    title: "Establecer modelo"
    prompt: "Ingresa el nombre del modelo (ej. claude-3.5-sonnet, gpt-4o)..."
    set: "Modelo establecido: %{name}"
    context_unknown: "desconocido (según el proveedor)"
    cost_unknown: "estimación no disponible"
    cost_free_local: "gratis (local)"
  remote:
    dashboard_title: "Objetivos remotos: la ejecución de herramientas sigue al objetivo activo."
    none: "Aún no hay objetivos. Añade uno con `/remote add ssh <user@host> <nombre> <directorio>`."
    usage: "Uso: /remote use <nombre> | test <nombre> | disconnect | reconnect | remove <nombre> [--yes] | add ssh <user@host> <nombre> <directorio> | add docker <contenedor> <nombre> <directorio>"
    hint_ssh: "Los hosts SSH candidatos se descubren desde ~/.ssh/config."
    connected: "✓ Conectado a %{name} (%{platform}, %{latency}ms). Las herramientas ahora se ejecutan en el objetivo remoto."
    disconnected: "✓ De vuelta en la máquina local."
    reconnected: "✓ Reconectado a %{name}."
    reconnect_failed: "Fallo al reconectar: %{error}"
    not_connected: "No hay objetivo remoto activo."
    not_found: "Objetivo desconocido '%{name}'. Consulta /remote list."
    remove_confirm: "¿Eliminar el objetivo '%{name}'? Confirma con `/remote remove %{name} --yes`."
    remove_done: "✓ Objetivo '%{name}' eliminado."
    test_ok: "✓ %{name}: %{platform}, %{latency}ms, bash=%{bash}, workspace=%{ws}"
    test_failed: "✗ %{name}: %{error}"
    added: "✓ Objetivo %{kind} '%{name}' guardado. Conéctate con `/remote use %{name}`."
    bash_missing: "⚠ bash no se encontró en el objetivo — la herramienta Bash requiere bash."
    already_connected: "Ya estás conectado a %{name}."
  goal:
    set: "◎ Objetivo establecido (máx %{max} iteraciones): %{objective}\nEnvía un mensaje para comenzar — Shannon sigue trabajando entre turnos hasta cumplir el objetivo. /goal pause para pausar, /goal clear para quitar."
    current: "Objetivo (%{status}, iteración %{iterations}/%{max}): %{objective}"
    current_none: "Sin objetivo. Uso: /goal <objetivo> | /goal pause | /goal resume | /goal clear"
    cleared: "✓ Objetivo eliminado."
    paused_no_progress: "⏸ Objetivo en pausa — sin progreso detectado: %{reason}\nStrikes: %{strikes}/%{max_strikes}. Inspecciona y luego /goal resume o /goal clear."
    paused_blocked: "⏸ Objetivo en pausa — el agente reporta un bloqueo: %{reason}\nResuélvelo y ejecuta /goal resume, o /goal clear para quitar."
    paused_budget: "⏸ Objetivo en pausa — tope de presupuesto alcanzado: %{reason}\nAumenta el tope con /goal <obj> --budget $N, o /goal clear."
    paused_max: "⏸ Objetivo en pausa tras %{max} iteraciones sin completarse. Evalúa y luego /goal resume o /goal clear."
    resumed: "▶ Objetivo reanudado (contador de iteraciones reiniciado)."
    complete: "✓ Objetivo completado tras %{iterations} iteración(es): %{objective}"
    conflict_loop: "Hay un /ralph o /loop activo — detenlo primero y luego define /goal."
  connect:
    success: "✓ Conectado a %{provider}"
    choose_model: "Elige un modelo abajo (Enter = predeterminado, ↑↓ = seleccionar, Esc = usar el predeterminado)."
    refresh_started: "Actualizando el catálogo de modelos en segundo plano…"
    refresh_success: "Catálogo actualizado — %{count} modelos disponibles."
    refresh_failed: "Sin conexión — usando el catálogo en caché."
    dashboard_header: "Conecta un proveedor — sin necesidad de variables de entorno."
    dashboard_providers: "Proveedores:"
    dashboard_usage: "Uso: /connect <proveedor> <clave-api>"
    dashboard_help: "detalle: /help connect"
    key_stored: "✓ Clave API almacenada para '%{provider}' (servicio: %{service})"
    config_saved: "✓ Configuración del proveedor guardada: %{path}"
    reusing_key: "• Reutilizando la clave almacenada para '%{provider}' (servicio: %{service})"
    cred_verified: "✓ Credencial verificada — '%{model}' es accesible con esta clave."
    auth_failed: "✗ Autenticación fallida para '%{provider}'. La clave fue almacenada pero el proveedor la rechazó — verifica la clave y ejecuta /connect de nuevo."
    verify_warning: "⚠ No se pudo verificar completamente la credencial de '%{provider}' (%{error}). La clave está almacenada; aún podría funcionar — prueba enviando un mensaje."
    probe_failed: "⚠ Falló la prueba de credencial para '%{provider}'. La clave está almacenada; aún podría funcionar."
    switched: "✓ Cambiado a %{provider} — modelo: %{model} (nueva credencial activa; no requiere reinicio)"
    storing_error: "almacenando credencial: %{error}"
    saving_error: "guardando providers.toml: %{error}"
  provider:
    available: "Proveedores disponibles:"
    legend: "* = actual | Usa /provider <nombre> para cambiar"
    switched: "Proveedor: %{provider} | Modelo: %{model}"
    switched_no_catalog: "Proveedor establecido a %{provider}. No tiene lista de modelos integrada — usa `/model <provider>/<model-id>` para elegir un modelo."
    no_selection: "No hay proveedor seleccionado. Ejecuta /connect <proveedor> <clave> primero."
  disconnect:
    usage: "Uso: /disconnect <proveedor>\nElimina la conexión guardada de un proveedor (su entrada en providers.toml) para que deje de estar conectado. Tu clave API almacenada se conserva — ejecuta /connect de nuevo para reconectar."
    not_connected: "'%{provider}' no estaba conectado. Usa /connect para conectarlo."
    done: "✓ '%{provider}' desconectado."
    switched: "Proveedor activo cambiado a %{provider} (modelo: %{model})."
    none_remain: "No quedan proveedores conectados — ejecuta /connect <proveedor> <clave> para reconectar."
  config:
    warning_load: "Advertencia: no se pudo cargar la configuración: %{error}"
    key_not_found: "Clave de configuración no encontrada: %{key}"
    error_saving: "Error al guardar la configuración: %{error}"
    usage_get: "Uso: /config get <clave>"
    usage_set: "Uso: /config set <clave> <valor>"
    usage_reset: "Uso: /config reset <clave>"
    settings_title: "Ajustes de configuración:\n\n"
    usage: |

      Uso:
        /config list          - Mostrar todos los ajustes
        /config get <clave>     - Obtener un valor específico
        /config set <clave> <valor> - Establecer un valor
        /config reset <clave>   - Restablecer al valor predeterminado
