        /credentials store <svc> <val> - एक क्रेडेंशियल सहेजें
        /credentials get <service>     - एक क्रेडेंशियल प्राप्त करें (मास्क किया हुआ)
        /credentials delete <service>  - एक क्रेडेंशियल हटाएँ
        /credentials count             - सहेजे गए क्रेडेंशियल की संख्या दिखाएँ
  session:
    snapshots_title: "सहेजे गए सेशन स्नैपशॉट:\n\n"
    none_saved: |-
      कोई सहेजा सेशन स्नैपशॉट नहीं।
      बनाने के लिए `/session save <name>` उपयोग करें।
    load_hint: "\nस्नैपशॉट पुनर्स्थापित करने के लिए `/session load <name>` उपयोग करें।"
  debug:
    help: |
      डेवलपर डीबग कमांड:

        /debug log [level]     - लॉग स्तर सेट करें (trace|debug|info|warn|error)
        /debug profile start   - प्रदर्शन प्रोफाइलिंग शुरू करें
        /debug profile stop    - प्रोफाइलिंग रोकें और परिणाम दिखाएँ
        /debug trace [on|off]  - निष्पादन ट्रेसिंग टॉगल करें
        /debug info            - सिस्टम निदान दिखाएँ

      लॉग स्तर:
        trace - आंतरिक सहित सभी संदेश
        debug - डीबग संदेश और ऊपर
        info  - सूचनात्मक संदेश (डिफ़ॉल्ट)
        warn  - केवल चेतावनियाँ और त्रुटियाँ
        error - केवल गंभीर त्रुटियाँ
    system_info_title: "सिस्टम निदान:\n\n"
  preset:
    available_title: "उपलब्ध प्रीसेट:\n\n"
    no_description: "कोई विवरण नहीं"
    usage: |

