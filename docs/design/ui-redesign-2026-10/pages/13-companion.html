<title>13 · 伴随窗 · 快速捕获 — Shannon v2 设计稿</title>
<link rel="stylesheet" href="../assets/shannon-ui.css">
<style>
  /* 桌面环境:径向渐变示意落在深色桌面上 */
  body {
    display: grid; place-items: center;
    background:
      radial-gradient(1000px 560px at 72% 14%, rgba(139,124,247,.10), transparent 62%),
      radial-gradient(760px 460px at 16% 84%, rgba(86,200,221,.07), transparent 62%),
      var(--ink);
  }
  .companion-win { position: relative; z-index: 2; }

  /* 桌面四角的内联说明 */
  .desk-note { position: fixed; z-index: 1; font-size: 10.5px; color: var(--t3); letter-spacing: .3px; }
  .dn-tl { top: 16px; left: 18px; }
  .dn-tr { top: 16px; right: 18px; }
  .dn-bl { bottom: 16px; left: 18px; }
  .dn-br { bottom: 34px; right: 18px; }

  /* 窗内部件 */
  .cw-head { display: flex; align-items: center; gap: 9px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--hair); }
  .cw-head .bm { width: 22px; height: 22px; border-radius: 7px; }
  .cw-head .bm svg { width: 13px; height: 13px; }
  .cw-title { font-size: 12.5px; font-weight: 650; letter-spacing: .2px; }
  .cw-body { padding: 11px 12px 0; }
  .cw-body textarea { width: 100%; resize: none; font-size: 12.5px; }
  .cw-body textarea::placeholder { color: var(--t3); }
  .cw-row { display: flex; align-items: center; gap: 6px; padding: 8px 0 10px; }
  .cw-hist { border-top: 1px solid var(--hair); }
  .cw-hist .itemrow { padding: 9px 14px; gap: 8px; }
  .cw-hist .t { font-size: 12px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cw-hist .tm { font-family: var(--mono); font-size: 10px; color: var(--t3); flex: none; }
  .cw-foot {
    border-top: 1px solid var(--hair); padding: 7px 14px;
    font-family: var(--mono); font-size: 10px; color: var(--t3); letter-spacing: .2px;
  }
</style>
</head>

<span class="desk-note dn-tl">伴随窗 · 置顶小窗 · <span class="mono">356 × 260</span></span>
<span class="desk-note dn-tr">不抢主窗口焦点</span>
<span class="desk-note dn-bl">捕获仅追加到主窗口草稿</span>
<span class="desk-note dn-br">失焦自动收起 · Esc 关闭</span>

<div class="companion-win glass-2 aurora-line">

  <!-- 窗头 -->
  <div class="cw-head">
    <div class="brandmark bm"><svg><use href="#i-logo"/></svg></div>
    <span class="cw-title">快速捕获</span>
    <span class="spacer"></span>
    <button class="iconbtn" style="width:26px;height:26px" title="置顶">
      <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px;color:var(--vio-2)">
        <path d="M12 17v5"/>
        <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16h14v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/>
      </svg>
    </button>
  </div>

  <!-- 输入 -->

    <textarea rows="3" placeholder="记一条,发给主窗口草稿…"></textarea>
    <div class="cw-row">
      <button class="chip">
        <span class="mono" style="font-size:11px;color:var(--t3)">#</span>
        <span class="cv">修复 billing webhook…</span>
        <svg class="caret"><use href="#i-chev-d"/></svg>
      </button>
      <span class="spacer"></span>
      <button class="btn pri sm"><svg class="ic"><use href="#i-send"/></svg>发到主窗口</button>
    </div>
  </div>

  <!-- 历史 capture -->
  <div class="cw-hist">
    <div class="itemrow dim">
      <div class="body" style="display:flex;align-items:center;gap:8px">
        <span class="t">明天 10 点同步设计稿状态</span>
        <span class="spacer"></span>
        <span class="tm">2 分钟前</span>
      </div>
    </div>
    <div class="itemrow dim" style="border-bottom:0">
      <div class="body" style="display:flex;align-items:center;gap:8px">
        <span class="t">查一下 Stripe webhook 重试机制文档</span>
        <span class="spacer"></span>
        <span class="tm">昨天</span>
      </div>
    </div>
  </div>

  <!-- 底部 hint -->
  <div class="cw-foot">全局快捷键唤起 · 只写入草稿,不自动发送</div>

</div>
