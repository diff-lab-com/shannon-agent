<title>01 · 欢迎引导 — Shannon v2 设计稿</title>
<link rel="stylesheet" href="../assets/shannon-ui.css">
<style>
  /* 步骤指示 */
  .step-pill {
    display: inline-flex; align-items: center; height: 28px; padding: 0 14px; border-radius: 99px;
    background: var(--vio-dim); border: 1px solid rgba(139,124,247,.45); color: var(--vio-2);
    font-size: 12px; font-weight: 550; letter-spacing: .2px; white-space: nowrap;
  }
  .step-next { font-size: 12px; color: var(--t3); white-space: nowrap; }

  /* 首启 composer 卡(复用 .composer 材质,宽度收窄) */
  .hero-composer { width: 680px; max-width: 680px; margin: 0; }
  .hero-composer textarea { font-size: 13.5px; }

  /* 模板卡 */
  .tpl-grid { width: 680px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tcard {
    background: var(--ink-2); border: 1px solid var(--hair); border-radius: var(--r2);
    padding: 12px 13px; cursor: pointer;
    transition: background .12s ease, border-color .12s ease, transform .12s ease;
  }
  .tcard:hover { background: var(--ink-3); border-color: rgba(139,124,247,.4); transform: translateY(-1px); }
  .tcard > .ic { width: 17px; height: 17px; color: var(--vio-2); }
  .tcard .t { font-size: 12.5px; font-weight: 600; color: var(--t1); margin-top: 9px; }
  .tcard .p { font-size: 11px; color: var(--t3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 底部一行 */
  .wfoot { width: 720px; display: flex; align-items: center; gap: 8px; }
  .wfoot .secured { white-space: nowrap; }
  .wfoot .note {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; color: var(--t3); white-space: nowrap;
  }
  .wfoot .note .ic { width: 12px; height: 12px; }
</style>
</head>

<div class="ambient"></div>

<div class="hero-full">

  <!-- 品牌 -->
  <div class="hero-brand">
    <div class="brandmark"><svg><use href="#i-logo"/></svg></div>
    <div>
      <div class="brand-name" style="font-size:16px">Shannon</div>
      <div class="brand-sub">你的 AI 工作空间</div>
    </div>
  </div>

  <!-- 步骤指示 -->
  <div class="row" style="gap:12px; margin:6px 0 18px">
    <span class="step-pill">第 1 步 · 共 2 步 —— 描述任务并确认模型</span>
    <span class="step-next">第 2 步 · 完成并开始</span>
  </div>

  <h1 class="hero-title">两分钟,<span class="grad">交出第一个任务</span></h1>
  <div class="hero-sub">本地优先 · 密钥永不出机 · 任意模型服务商 BYOK</div>

  <!-- composer 式输入卡 -->
  <div class="composer aurora-line hero-composer mt24">
    <div class="ta"><textarea rows="3" placeholder="描述你的第一个任务,或选下面的模板…"></textarea></div>
    <div class="compose-row">
      <button class="chip">
        <svg class="ic"><use href="#i-spark"/></svg>
        <span class="cv">claude-sonnet-4-6</span>
        <svg class="caret"><use href="#i-chev-d"/></svg>
      </button>
      <button class="chip">
        <svg class="ic"><use href="#i-folder"/></svg>
        <span class="cv mono" style="font-size:11.5px">~/work/shannon-mono</span>
      </button>
      <span class="spacer"></span>
      <button class="btn pri">开始 →</button>
    </div>
  </div>

  <!-- 模板卡 -->
  <div class="tpl-grid mt12">
    <div class="tcard">
      <svg class="ic"><use href="#i-target"/></svg>
      <div class="t">修复失败的测试</div>
      <div class="p">定位断言,给出补丁</div>
    </div>
    <div class="tcard">
      <svg class="ic"><use href="#i-branch"/></svg>
      <div class="t">审查一个 PR</div>
      <div class="p">逐文件点评改动风险</div>
    </div>
    <div class="tcard">
      <svg class="ic"><use href="#i-chart"/></svg>
      <div class="t">总结数据报告</div>
      <div class="p">从 CSV 提炼结论</div>
    </div>
    <div class="tcard">
      <svg class="ic"><use href="#i-layers"/></svg>
      <div class="t">重构旧模块</div>
      <div class="p">平滑迁移旧接口</div>
    </div>
  </div>

  <!-- 底部:密钥状态 + 隐私说明 + 跳过 -->
  <div class="wfoot mt16">
    <span class="secured"><svg class="ic"><use href="#i-shield"/></svg>已检测到本机密钥:ANTHROPIC ✓ OPENAI ✓ GLM ✓</span>
    <button class="btn ghost sm">添加其他服务商</button>
    <span class="spacer"></span>
    <span class="note"><svg class="ic"><use href="#i-shield"/></svg>密钥保存在本机 <span class="mono">~/.shannon</span>,永不外发</span>
    <button class="btn ghost sm">跳过,稍后配置</button>
  </div>

</div>
<div class="mocktag">01 · 欢迎引导 · shannon v2 设计稿</div>
