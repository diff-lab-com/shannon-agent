<style>
  .palette .plist { padding: 2px 0 8px; }

  .pi.sel .meta { color: var(--t2); }
  .pi .meta .plus { color: var(--ok); }
  .pi .meta .minus { color: var(--bad); }
  .pfoot {
    display: flex; align-items: center; gap: 14px; padding: 9px 14px;
    border-top: 1px solid var(--hair); font-size: 11px; color: var(--t3);
  }
  .pfoot .kbd { margin-right: 3px; }
</style>

<div class="ambient"></div>
<div class="overlay-dim"></div>

<div class="palette glass-2">

  <!-- 搜索行(预填 diff) -->
  <div class="pin">
    <svg class="ic" style="color:var(--t3)"><use href="#i-search"/></svg>
    <input value="diff" spellcheck="false">
    <span class="kbd">esc</span>
  </div>

  <div class="plist">
    <!-- 页面 -->
    <div class="group-label">页面</div>
    <div class="pi sel">
      <svg class="ic"><use href="#i-history"/></svg>回放时间线 · 修复 billing webhook
      <span class="kbd">↵</span>
    </div>

    <!-- 会话 -->
    <div class="group-label">会话</div>
    <div class="pi">
      <svg class="ic"><use href="#i-chat"/></svg>修复 billing webhook 签名校验
      <span class="meta"><span class="plus">+38</span> <span class="minus">−11</span></span>
    </div>
    <div class="pi">
      <svg class="ic"><use href="#i-chat"/></svg>结算对账脚本重构
      <span class="meta">昨天</span>
    </div>

    <!-- 模型 -->
    <div class="group-label">模型</div>
    <div class="pi">
      <svg class="ic"><use href="#i-spark"/></svg>切换模型 · claude-opus-4-1
      <span class="meta">当前 sonnet-4-6</span>
    </div>

    <!-- 设置 -->
    <div class="group-label">设置</div>
    <div class="pi"><svg class="ic"><use href="#i-sliders"/></svg>通用</div>
    <div class="pi"><svg class="ic"><use href="#i-image"/></svg>外观</div>
    <div class="pi"><svg class="ic"><use href="#i-spark"/></svg>模型</div>
    <div class="pi"><svg class="ic"><use href="#i-gear"/></svg>权限与安全</div>
    <div class="pi"><svg class="ic"><use href="#i-inbox"/></svg>通知</div>
    <div class="pi"><svg class="ic"><use href="#i-grid"/></svg>连接</div>
    <div class="pi"><svg class="ic"><use href="#i-target"/></svg>关于</div>
    <div class="pi"><svg class="ic"><use href="#i-term"/></svg>高级 <span class="st mute" style="height:15px;padding:0 6px;font-size:9.5px">dev</span></div>

    <!-- 操作 -->
    <div class="group-label">操作</div>
    <div class="pi"><svg class="ic"><use href="#i-download"/></svg>导出会话 Markdown</div>
    <div class="pi"><svg class="ic"><use href="#i-bolt"/></svg>新建例行任务</div>
  </div>

  <!-- 底部键位提示 -->
  <div class="pfoot">
    <span><span class="kbd">↑</span><span class="kbd">↓</span>选择</span>·
    <span><span class="kbd">↵</span>打开</span>·
    <span><span class="kbd">tab</span>切组</span>·
    <span><span class="kbd">esc</span>关闭</span>
    <span class="spacer"></span>
    <span class="mono" style="font-size:10px">Shannon 全局命令</span>
  </div>

</div>
<div class="mocktag">14 · 命令面板 · shannon v2 设计稿</div>
