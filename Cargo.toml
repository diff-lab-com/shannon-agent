# =============================================================================
# Root workspace manifest for the shannon-agent monorepo.
# ACTIVATED IN PHASE 2 (see ../MIGRATION.md): copy this file to the repo root,
# replacing the old shannon-code workspace Cargo.toml.
#
# What this does:
#  - Claims crates/* and desktop/ as one Cargo workspace.
#  - Lets desktop depend on engine crates via `shannon-core.workspace = true`
#    (path + version) — deleting every git/SSH/rev dep and the [patch] block.
#  - Keeps gateway OUT of Cargo (it is TypeScript — an independent pnpm package, not a workspace member).
# =============================================================================

[workspace]
resolver = "2"
members = [
    "crates/*",
    "desktop",
]
# gateway/ is TS, intentionally not a Cargo member.

[workspace.package]
version = "0.12.0"           # unified release version (one tag = all three products)
edition = "2024"
rust-version = "1.88"
authors = ["Shannon Contributors"]
license = "Apache-2.0"
repository = "https://github.com/diff-lab-com/shannon-agent"
homepage = "https://github.com/diff-lab-com/shannon-agent"

[workspace.dependencies]
# ---- Async runtime ----
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
async-trait = "0.1"

# ---- Serialization ----
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# ---- CLI ----
clap = { version = "4.5", features = ["derive"] }

# ---- Terminal UI ----
ratatui = "0.29"
crossterm = "0.28"

# ---- Error handling ----
anyhow = "1.0"
thiserror = "2.0"

# ---- Logging ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ---- HTTP / WS server ----
# `rustls-tls` is locked on (no `default-features`) so the workspace builds
# cleanly against `x86_64-unknown-linux-musl` — `openssl` is intentionally
# absent. musl still needs a C cross-toolchain because `ring` (rustls's
# crypto backend) compiles a small amount of C; see README.md §Static /
# musl Builds for the one-time setup. Adding `aws-lc-sys` here would
# drop the C dependency entirely once reqwest exposes a stable feature
# gate for it.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# ---- Utilities ----
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
futures-util = "0.3"
dirs = "5.0"
dotenvy = "0.15"
bytes = "1.0"

# ---- i18n ----
rust-i18n = "3"
sys-locale = "0.3"

# ---- WebSocket client ----
tokio-tungstenite = { version = "0.26", features = ["connect"] }

# ---- OAuth2 PKCE ----
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
urlencoding = "2.1"

# ---- Image / archive ----
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# ---- Office document parsing (desktop Office Wave A2') ----
# Pure-Rust, MIT/Apache-2.0 dual-licensed parsers for the send_message text
# injection pipeline: roxmltree for OOXML document parts, calamine for
# xlsx/ods cell values, csv for delimited text. calamine is pinned to the
# 0.26 line because that is the last series resolving against zip 2.x — the
# same zip already in the tree; newer calamine would pull a second zip major.
roxmltree = "0.20"
calamine = "0.26"
csv = "1.3"

# ---- Office document generation (office Wave 2 B1) ----
# Engine-native xlsx writing for the `write_xlsx` tool (crates/shannon-tools).
# MIT/Apache-2.0 dual-licensed. Default features are off: without `zlib` the
# zip writer uses the pure-Rust deflate backend, so no C toolchain is needed
# and no second compression library enters the tree.
rust_xlsxwriter = { version = "0.99", default-features = false }

# ---- Email (IMAP) data source (office Wave 2 B3) ----
# `imap` implements the IMAP4rev1 client. Pinned to the 2.4.1 stable line with
# `default-features = false`: its only first-party TLS integration is
# native-tls/openssl, which the workspace forbids (musl builds). Instead the
# fetcher wires TLS out-of-band with rustls-connector 0.23, which rides the
# SAME rustls 0.23 line the workspace already locks via reqwest — its 0.19
# series would have pulled a second rustls 0.22 + rustls-webpki 0.102 tree
# (RUSTSEC-2026-0104, unpatched on 0.102). Features: `native-certs` (system
# trust store) + `rustls--ring` (the crypto provider already in the tree —
# NOT the default aws-lc-rs, which would add a C toolchain requirement).
# rustls-connector is declared directly so the fetcher can set socket
# read/write timeouts on the raw TcpStream BEFORE the TLS handshake wraps it
# (imap opens no socket itself via `Client::new`, and offers no timeout hook
# elsewhere). mailparse decodes MIME bodies and RFC 2047 headers. Licenses:
# Apache-2.0/MIT (imap), MIT/Apache-2.0 (mailparse), BSD-2-Clause
# (rustls-connector) — all on the cargo-deny allowlist.
imap = { version = "2.4.1", default-features = false }
mailparse = "0.17"
rustls-connector = { version = "0.23", default-features = false, features = ["native-certs", "rustls--ring"] }

# ---- Testing ----
proptest = "1"
# P2-3 (improvement plan §P2-3): snapshot tests for chat rendering, command
# output, MCP tool responses. Pinned to the 1.x line — the 2.x series drops
# some macros used by our existing snapshots (assert_yaml_snapshot) and
# forces a global review. The `json` feature pulls in serde_json so
# `assert_json_snapshot!` is available; `yaml` is on by default.
# See docs/plans/insta-workflow.md.
insta = { version = "1.48", features = ["json"] }

# ---- tree-sitter (repo map) ----
# Pinned family: tree-sitter 0.24 + grammar crates on the 0.23.x line.
# All grammar crates (rust/typescript/python/go) consume
# tree-sitter-language 0.1, which is the FFI bridge that pairs with the
# 0.24.x runtime. The grammar crates' own `tree-sitter` dep is dev-only.
# 0.25.x grammars would require the aliyun mirror to refresh first; per
# docs/plans/repo-map.md §tree-sitter-versions we hold the line at 0.23.x.
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"

# ---- Embedded SQL store (P0-3) ----
# Inbox items + automation run history (`~/.shannon/inbox.db`). `bundled`
# compiles the SQLite C sources — expected on first build, then cached.
# Only this store uses SQLite; session events.jsonl stays append-only JSONL.
rusqlite = { version = "0.37", features = ["bundled"] }

# ---- File walking ----
walkdir = "2.5"

# ---- File watcher (used by shannon-repomap incremental update) ----
notify = "7"

# ---- Lazy statics / one-time globals ----
once_cell = "1.20"

# ---- Binary cache for the repo map ----
bincode = "1"

# ---- Proc-macro infra ----
proc-macro2 = "1"
quote = "1"
syn = "2"

# =============================================================================
# Internal crates — path + version dual declaration.
# In-tree: compiles from local source. Publishable: version satisfies crates.io.
# Desktop uses these via `<name>.workspace = true` (no git, no SSH, no rev, no patch).
# =============================================================================
shannon-core   = { path = "crates/shannon-core",   version = "0.12.0" }
shannon-engine = { path = "crates/shannon-engine", version = "0.12.0" }
shannon-types  = { path = "crates/shannon-types",  version = "0.12.0" }
shannon-tools  = { path = "crates/shannon-tools",  version = "0.12.0" }
shannon-tool-interface = { path = "crates/shannon-tool-interface", version = "0.12.0" }

shannon-mcp    = { path = "crates/shannon-mcp",    version = "0.12.0" }
shannon-skills = { path = "crates/shannon-skills", version = "0.12.0" }
shannon-agents = { path = "crates/shannon-agents", version = "0.12.0" }
shannon-api-protocol = { path = "crates/shannon-api-protocol", version = "0.12.0" }
shannon-stability-attr = { path = "crates/shannon-stability-attr" }          # proc-macro: no version

# ---- Desktop-specific (declared at workspace level so both roots agree) ----
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
# Moved from .cargo/config.toml (2026-09-28): cargo silently IGNORES
# [profile.*] tables in config files — profiles only load from the workspace
# root manifest — so the memory cap below never actually applied from there.
# codegen-units=2 + "line-tables-only" pairs with [build] jobs=4 in
# .cargo/config.toml to cap peak build memory at ~8Gi (4 parallel jobs x
# ~1.5Gi); line tables preserve panic backtraces without full variable data.
codegen-units = 2
debug = "line-tables-only"

# Mirrors [profile.dev] (test inherits dev by default, but keep the table so
# the memory cap survives future dev-profile edits). Same config.toml origin.
[profile.test]
codegen-units = 2
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "thin"
