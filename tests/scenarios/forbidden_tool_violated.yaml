name: forbidden_tool_violated
description: "Negative behavioral assertion: Edit is banned and was invoked, so validation must fail"
prompt: "Read src/main.rs then replace Hello with Goodbye"
provider: anthropic

setup:
  files:
    - path: src/main.rs
      content: |
        fn main() {
            println!("Hello, world!");
        }

mock_responses:
  - response:
      type: tool_use
      tool: Read
      tool_id: toolu_1
      input: { "path": "src/main.rs" }
  - response:
      type: tool_use
      tool: Edit
      tool_id: toolu_2
      input: { "path": "src/main.rs", "old_string": "Hello", "new_string": "Goodbye" }
  - response:
      type: text
      content: "Updated the greeting."

validate:
  - rule: forbidden_tool
    tool: Edit
