name: traj_contains_hit
description: "Positive behavioral assertion: observed Read->Edit subsequence matches in order"
prompt: "Read src/main.rs then replace Hello with Goodbye"
provider: anthropic

setup:
  files:
    - path: src/main.rs
      content: |
        fn main() {
            println!("Hello, world!");
        }

mock_responses:
  - response:
      type: tool_use
      tool: Read
      tool_id: toolu_1
      input: { "path": "src/main.rs" }
  - response:
      type: tool_use
      tool: Edit
      tool_id: toolu_2
      input: { "path": "src/main.rs", "old_string": "Hello", "new_string": "Goodbye" }
  - response:
      type: text
      content: "Updated the greeting."

validate:
  - rule: trajectory_contains
    sequence:
      - tool: Read
        args_regex: '"path":"src/main\.rs"'
      - tool: Edit
        args_regex: '"old_string":"Hello"'
