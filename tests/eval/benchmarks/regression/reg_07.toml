# ── Regression pool task 7/10 · §4.13 W2-M3 ────────────────────────────────
# Source defect: CHANGELOG.md v0.7.0 → Fixed — release pipeline: "shasum -a
# 256 for the CLI checksum (macOS has no sha256sum)".

id = "reg_07_checksum_portability"
tier = "edit"
description = "release checksum step must fall back to `shasum -a 256` when sha256sum is unavailable (v0.7.0 packaging fix)"
prompt = """Issue report (from this repo's v0.7.0 release engineering notes):
The darwin release runner crashed while computing the CLI artifact digest:
scripts/release_checksum.sh hardcodes GNU coreutils' sha256sum, which macOS
does not ship — that platform provides shasum(1).

Repair scripts/release_checksum.sh so digests are produced on both platforms:

1. When `command -v sha256sum` succeeds, keep using it (write
   `<artifact>.sha256` exactly as before).
2. Otherwise invoke `shasum -a 256` writing the same output file.

Keep everything else in the script (set -eu, artifact argument handling) as-is.
"""

[[setup.files]]
path = "scripts/release_checksum.sh"
content = '''
#!/bin/sh
# Release artifact checksumming (Shannon v0.7.0 packaging).
# REGRESSION: macOS ships shasum(1), not sha256sum(1), so the dist job
# crashed computing CLI digests on darwin runners.
set -eu

artifact="$1"

sha256sum "$artifact" > "$artifact.sha256"
'''

[verify]
[[verify.rules]]
rule = "exit_code"
value = "success"

[[verify.rules]]
rule = "file_content"
path = "scripts/release_checksum.sh"
contains = "command -v sha256sum"

[[verify.rules]]
rule = "file_content"
path = "scripts/release_checksum.sh"
contains = "shasum -a 256"

[[verify.rules]]
rule = "trajectory_contains"
sequence = [{ tool = "Edit" }]

script = '''
set -e
test -f scripts/release_checksum.sh
grep -qF 'set -eu' scripts/release_checksum.sh \
  || { echo "FAIL: strict mode dropped"; exit 1; }
grep -qF 'command -v sha256sum' scripts/release_checksum.sh \
  || { echo "FAIL: primary branch missing"; exit 1; }
grep -qF 'shasum -a 256' scripts/release_checksum.sh \
  || { echo "FAIL: darwin fallback missing"; exit 1; }
'''

[expectations]
forbidden_tools = ["Write", "Bash"]

[limits]
max_turns = 6
max_tokens = 12000
timeout_secs = 180

[dry_run]
final_text = "Checksum step now degrades to shasum -a 256 on macOS."

[[dry_run.steps]]
tool = "Read"
input = { file_path = "scripts/release_checksum.sh" }

[[dry_run.steps]]
tool = "Edit"
input = { file_path = "scripts/release_checksum.sh", old_string = "sha256sum \"$artifact\" > \"$artifact.sha256\"", new_string = "if command -v sha256sum >/dev/null 2>&1; then\n    sha256sum \"$artifact\" > \"$artifact.sha256\"\nelse\n    shasum -a 256 \"$artifact\" > \"$artifact.sha256\"\nfi" }
