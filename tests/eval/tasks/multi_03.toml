id = "multi_03"
tier = "multi_step"
description = "Extract a shared helper and refactor two consumers onto it."
prompt = "Create src/math_utils.rs containing the median function extracted from src/stats.rs, then make both src/stats.rs and src/report.rs call it instead of their local copies."

[setup]
[[setup.files]]
path = "src/stats.rs"
content = """pub fn median(values: &[f64]) -> f64 {
    sorted_middle(values)
}

pub fn mean(values: &[f64]) -> f64 { 0.0 }
"""

[[setup.files]]
path = "src/report.rs"
content = """pub fn median(values: &[f64]) -> f64 {
    sorted_middle(values)
}

pub fn summary(values: &[f64]) -> String { format!("{}", values.len()) }
"""

[verify]
script = "grep -q 'pub fn median' src/math_utils.rs && ! grep -q 'fn median' src/stats.rs && grep -q 'math_utils::median' src/report.rs"

[[verify.rules]]
rule = "exit_code"
value = "success"

[[verify.rules]]
rule = "file_exists"
path = "src/math_utils.rs"

[[verify.rules]]
rule = "file_content"
path = "src/stats.rs"
contains = "math_utils::median"

[[verify.rules]]
rule = "file_content"
path = "src/report.rs"
contains = "math_utils::median"

[expectations]
forbidden_tools = ["Bash"]

[[expectations.trajectory]]
tool = "Write"
args_regex = '"file_path":"src/math_utils.rs"'

[[expectations.trajectory]]
tools = ["Edit", "MultiEdit"]

[limits]
max_turns = 50
max_tokens = 1000000
timeout_secs = 600

[dry_run]
final_text = "Extracted median into math_utils and pointed both consumers at it."

[[dry_run.steps]]
tool = "Read"
input = { file_path = "src/stats.rs" }

[[dry_run.steps]]
tool = "Read"
input = { file_path = "src/report.rs" }

[[dry_run.steps]]
tool = "Write"
input = { file_path = "src/math_utils.rs", content = "pub fn median(values: &[f64]) -> f64 {\n    sorted_middle(values)\n}\n" }

[[dry_run.steps]]
tool = "Edit"
input = { file_path = "src/stats.rs", old_string = "pub fn median(values: &[f64]) -> f64 {\n    sorted_middle(values)\n}", new_string = "pub use crate::math_utils::median;" }

[[dry_run.steps]]
tool = "Edit"
input = { file_path = "src/report.rs", old_string = "pub fn median(values: &[f64]) -> f64 {\n    sorted_middle(values)\n}", new_string = "pub use crate::math_utils::median;" }
